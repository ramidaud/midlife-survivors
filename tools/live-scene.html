<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scene Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ui/ms-nav.css?v=7">
<style>
  :root { --navy:#171C35; --navy2:#232946; --slate:#303750; --teal:#3E7775; --sage:#83A89A; --cream:#F2D7A1; --paper:#FFF0CF; --tan:#D3B78D; --orange:#EF9347; --russet:#874C3B; }
  body { margin:0; background:var(--navy); color:var(--paper); font:15px/1.45 "Atkinson Hyperlegible", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .back { display:inline-block; margin:0 0 8px; font:12px/1.2 "Silkscreen", monospace; color:var(--cream); text-decoration:none; opacity:.85; }
  .memo { display:inline-block; background:var(--cream); color:var(--navy); font:12px Silkscreen, monospace; padding:4px 10px; margin-bottom:8px; }
  h1 { font:20px Silkscreen, monospace; margin:0 0 4px; color:var(--cream); }
  .sub { margin:0 0 12px; color:var(--tan); font-size:14px; max-width:70ch; }
  .stage { position:relative; border:2px solid var(--teal); background:#000; aspect-ratio:1280/853; overflow:hidden; }
  .stage canvas { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .stage #fx { position:absolute; inset:0; pointer-events:none; }
  .stage.shake #cv, .stage.shake #fx { transform:translate(6px,-4px); }
  .stage.shake2 #cv, .stage.shake2 #fx { transform:translate(-5px,3px); }
  .beat { font:11px Silkscreen,monospace; color:var(--paper); display:flex; gap:6px; align-items:center; border:2px solid var(--teal); padding:6px 8px; background:var(--navy2); cursor:pointer; }
  .beat input { accent-color:var(--orange); }
  .stage.cover { aspect-ratio:9/16; max-width:380px; }
  .stage.cover canvas { object-fit:cover; }
  .stage.cover.fit canvas { object-fit:contain; } /* cut scenes on phones: the whole 16:9 picture with bars (Nov 7) */
  .pick { font:11px Silkscreen, monospace; color:var(--paper); border:2px solid var(--teal); padding:8px 10px; text-decoration:none; background:var(--navy2); }
  .pick.on { background:var(--teal); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
  button { font:11px Silkscreen, monospace; background:var(--navy2); color:var(--paper); border:2px solid var(--teal); padding:8px 10px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--teal); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin:12px 0; }
  .tile { border:2px solid var(--teal); padding:8px 10px; background:var(--navy2); }
  .tile b { display:block; font:16px Silkscreen, monospace; color:var(--cream); }
  .tile span { font-size:13px; color:var(--sage); }
  .note { border-left:4px solid var(--orange); padding:6px 10px; background:var(--navy2); color:var(--tan); font-size:14px; }
</style>
</head>
<body>
<script src="../assets/ui/ms-nav.js?v=5"></script>
<main>
  <a class="back" href="sprites.html">&larr; Sprite Board</a><br>
  <span class="memo">MEMO · RE: LIVE SCENES (TEST)</span>
  <h1 id="h-title">Live scene test</h1>
  <p class="sub" id="h-sub"></p>
  <div class="row" id="scene-pick">
    <a class="pick" href="?scene=late-night">11:58 PM (title scene)</a>
    <a class="pick" href="?scene=performance-review">Performance Review intro (cut scene)</a>
    <a class="pick" href="?scene=chase">Office chase (Grok prototype)</a>
  </div>

  <div class="stage" id="stage"><canvas id="cv"></canvas><canvas id="fx" aria-hidden="true"></canvas></div>
  <div class="row" id="beats" hidden><b style="font:11px Silkscreen,monospace;color:var(--cream)">EXTRA BEATS:</b></div>

  <div class="row">
    <button id="b-play" aria-pressed="true">Playing</button>
    <button id="b-still" aria-pressed="false">Reduced motion (still)</button>
    <button id="b-boxes" aria-pressed="false">Show repaint boxes</button>
    <button id="b-phone" aria-pressed="false">Phone crop</button>
  </div>

  <div class="tiles">
    <div class="tile"><b id="t-size">…</b><span>download, whole scene</span></div>
    <div class="tile"><b id="t-cmp">…</b><span id="t-cmp-l">video version, for comparison</span></div>
    <div class="tile"><b id="t-ms">…</b><span>drawing time per pose change</span></div>
    <div class="tile"><b id="t-area">…</b><span>share of the picture repainted each time</span></div>
  </div>

  <p class="note" id="h-note"></p>
</main>
<script src="live-scene/live-scene.js?v=3"></script>
<script>
(async () => {
  // Two scenes (Nov 7): ChatGPT's 11:58 PM title art, and Grok's chase prototype.
  const SCENES = {
    "late-night": { title: "Live scene test: 11:58 PM", sub: "ChatGPT's title art, built from an empty-room plate plus five small layers: the worker (breathing, blinking, sipping), steam, the monitor, the sticky note and Bill. 8 poses a second, an 8-second loop.",
      cmp: "843 KB", cmpLabel: "the 8-second AI video, for comparison", note: "What to look for: the clock still reads 11:58 and the note still says \"just one more run\" in every frame. The big dark area, where the title and menu sit, never moves. Phone crop shows the left side, like the real title screen on a phone.", focus: "24% 50%" },
    "performance-review": { title: "Cut scene test: Performance Review intro", sub: "The first boss intro, from Grok's storyboard and ChatGPT's frames: the bullpen plate plus the 9-to-5er (3 poses) and the Performance Review (4 poses). Four seconds. In the game it plays once, right before the fight; here it loops so you can watch it again.",
      cmp: "n/a", cmpLabel: "no video version was made", letterbox: true, note: "Phone view shows the whole picture with bars above and below, the way a cut scene would play on a phone. The beats: formal introduction, a very important clipboard, the stomp, and 'not intimidated, much.' Possible caption, painted into the wall later if you want it: 'You brought experience. They brought a clipboard.'", focus: "50% 60%" },
    "chase": { title: "Live scene test: the office chase", sub: "Grok's prototype layers in the same format. The smeared floor is expected; this one was about file size and speed, not the art.",
      cmp: "1.45 MB", cmpLabel: "Grok's 4-second MP4, for comparison", note: "What to look for: the \"DO NOT TOUCH MY MUG\" sign and the whole office never move. Only the characters do, in whole-pixel steps. With reduced motion on, you get one still picture.", focus: "45% 50%" }
  };
  const key = SCENES[new URLSearchParams(location.search).get("scene")] ? new URLSearchParams(location.search).get("scene") : "late-night";
  const CFG = SCENES[key], base = "live-scene/" + key + "/";
  document.getElementById("h-title").textContent = CFG.title; document.getElementById("h-sub").textContent = CFG.sub;
  document.getElementById("h-note").textContent = CFG.note; document.getElementById("t-cmp").textContent = CFG.cmp; document.getElementById("t-cmp-l").textContent = CFG.cmpLabel;
  document.querySelectorAll(".pick").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "?scene=" + key));
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fxOpts = {}; // filled in below for scenes with extra beats
  const scene = await LiveScene.create(document.getElementById("cv"), base, { still: reduce, onFrame: n => fxOpts.draw && fxOpts.draw(n) });
  if (key === "performance-review") addBeats(scene, fxOpts);
  window._f = scene.frame;
  document.getElementById("stage").style.aspectRatio = scene.scene.w + " / " + scene.scene.h;
  document.getElementById("cv").style.objectPosition = CFG.focus; document.getElementById("fx").style.objectPosition = CFG.focus;
  const $ = id => document.getElementById(id);
  const set = (b, on, label) => { b.setAttribute("aria-pressed", on ? "true" : "false"); if (label) b.textContent = label; };
  set($("b-still"), reduce); set($("b-play"), !reduce, reduce ? "Paused" : "Playing");
  $("b-play").onclick = () => { if (scene.playing()) { scene.pause(); set($("b-play"), false, "Paused"); } else { scene.still(false); set($("b-still"), false); scene.play(); set($("b-play"), true, "Playing"); } };
  $("b-still").onclick = () => { const on = $("b-still").getAttribute("aria-pressed") !== "true"; scene.still(on); set($("b-still"), on); set($("b-play"), !on, on ? "Paused" : "Playing"); };
  $("b-boxes").onclick = () => { const on = $("b-boxes").getAttribute("aria-pressed") !== "true"; scene.boxes(on); set($("b-boxes"), on); };
  $("b-phone").onclick = () => { const on = $("b-phone").getAttribute("aria-pressed") !== "true"; $("stage").classList.toggle("cover", on); $("stage").classList.toggle("fit", on && !!CFG.letterbox); $("stage").style.aspectRatio = on ? "9 / 16" : scene.scene.w + " / " + scene.scene.h; set($("b-phone"), on); };
  // Total download: ask the server for each file's size.
  const files = [scene.scene.plate, ...scene.scene.layers.map(l => l.sheet), "scene.json"];
  const sizes = await Promise.all(files.map(f => fetch(base + f, { method: "HEAD" }).then(r => +r.headers.get("content-length") || 0).catch(() => 0)));
  const kb = sizes.reduce((a, b) => a + b, 0) / 1024;
  $("t-size").textContent = kb ? Math.round(kb) + " KB" : "n/a";
  const S = scene.scene;
  setInterval(() => {
    const st = scene.stats();
    if (st.draws) { $("t-ms").textContent = st.avgMs.toFixed(2) + " ms"; $("t-area").textContent = Math.round(st.avgPx / (S.w * S.h) * 100) + "%"; }
  }, 1000);
})();

// Extra beats for the Performance Review intro (Nov 7): code-drawn effects on a see-through
// canvas over the scene, so Rami can try each idea before any new art is ordered.
// Coordinates are in the scene's 1920x1080 pixels. Frames: 0-7 hello, 8-15 clipboard, 16-23 foot up, 24-31 stomp.
function addBeats(scene, fxOpts) {
  const S = scene.scene, cv = document.getElementById("fx"), stage = document.getElementById("stage");
  cv.width = S.w; cv.height = S.h; const g = cv.getContext("2d");
  const BEATS = [
    ["title", "Title card"], ["printer", "Printer spewing"], ["monitors", "Monitor flicker"],
    ["stamp", "Clipboard stamp"], ["stomp", "Stomp dust + shake"], ["sweat", "Hero sweat drop"], ["caption", "Caption"]
  ];
  const on = {}; const box = document.getElementById("beats"); box.hidden = false;
  BEATS.forEach(([id, label]) => {
    on[id] = true;
    const l = document.createElement("label"); l.className = "beat";
    l.innerHTML = `<input type="checkbox" checked> ${label}`;
    l.querySelector("input").onchange = e => { on[id] = e.target.checked; fxOpts.draw(scene.frame()); };
    box.appendChild(l);
  });
  const C = { navy: "#171C35", cream: "#F2D7A1", paper: "#FFF0CF", orange: "#EF9347", russet: "#874C3B", teal: "#3E7775", red: "#B5362F" };
  const font = (px) => `${px}px Silkscreen, monospace`;
  const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  let tick = 0; // counts every drawn frame, so looping effects keep moving
  const sheets = []; // printer paper
  fxOpts.draw = n => {
    tick++; g.clearRect(0, 0, S.w, S.h); stage.classList.remove("shake", "shake2");
    // Monitor flicker: soft glows over two CRTs (no hard edges, so they can't misalign).
    if (on.monitors) [[480, 290, 70], [1890, 400, 60]].forEach(([x, y, r], i) => {
      const a = ((tick * 7 + i * 13) % 11 < 2) ? 0.35 : 0.12 + 0.06 * Math.sin(tick + i);
      const rg = g.createRadialGradient(x, y, 4, x, y, r); rg.addColorStop(0, `rgba(170,230,215,${a})`); rg.addColorStop(1, "rgba(170,230,215,0)");
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    });
    // Printer: a sheet every few frames slides out and flutters to the floor.
    if (on.printer) {
      if (tick % 3 === 0) sheets.push({ x: 1600, y: 330, vx: 6 + Math.random() * 6, vy: 2, r: 0, vr: (Math.random() - 0.5) * 0.3, life: 0 });
      for (let i = sheets.length - 1; i >= 0; i--) {
        const p = sheets[i]; p.life++; p.x += p.vx; p.y += p.vy; p.vy = Math.min(p.vy + 3, 14); p.r += p.vr;
        if (p.y > 520 || p.life > 14) { sheets.splice(i, 1); continue; }
        g.save(); g.translate(Math.round(p.x), Math.round(p.y)); g.rotate(p.r);
        g.fillStyle = C.navy; g.fillRect(-15, -11, 30, 22); g.fillStyle = C.paper; g.fillRect(-12, -8, 24, 16);
        g.fillStyle = "#9aa0b5"; g.fillRect(-8, -4, 16, 2); g.fillRect(-8, 1, 12, 2); g.restore();
      }
    } else sheets.length = 0;
    // Title card: slams in, holds through the introduction, then slides away.
    if (on.title && n < 10) {
      const s = 1 + 0.6 * (1 - ease(n / 2)), y = n < 8 ? 150 : 150 - (n - 7) * 90;
      g.save(); g.translate(960, y); g.scale(s, s);
      g.fillStyle = C.navy; g.fillRect(-520, -78, 1040, 156); g.fillStyle = C.orange; g.fillRect(-520, 62, 1040, 16);
      g.fillStyle = C.orange; g.font = font(30); g.textAlign = "center"; g.fillText("BOSS · AGE 45", 0, -24);
      g.fillStyle = C.cream; g.font = font(64); g.fillText("PERFORMANCE REVIEW", 0, 42); g.restore();
    }
    // Clipboard stamp: lands while the clipboard is held up, stays to the end.
    if (on.stamp && n >= 12) {
      const s = 1 + 1.2 * (1 - ease((n - 12) / 2));
      g.save(); g.translate(1160, 650); g.rotate(-0.22); g.scale(s, s); g.globalAlpha = n < 14 ? 0.7 : 0.92;
      g.fillStyle = "rgba(255,240,207,0.55)"; g.fillRect(-140, -50, 280, 100);
      g.strokeStyle = C.red; g.lineWidth = 9; g.strokeRect(-140, -50, 280, 100);
      g.fillStyle = C.red; g.strokeStyle = C.red; g.lineWidth = 2; g.textAlign = "center";
      g.font = font(34); g.fillText("MEETS", 0, -8, 250); g.strokeText("MEETS", 0, -8, 250);
      g.font = font(22); g.fillText("EXPECTATIONS", 0, 30, 250); g.strokeText("EXPECTATIONS", 0, 30, 250); g.restore();
    }
    // Stomp: the foot lands on frame 24. Dust puffs and a two-frame shake.
    if (on.stomp && n >= 24 && n <= 28) {
      const t = (n - 24) / 4;
      if (n === 24) stage.classList.add("shake"); if (n === 25) stage.classList.add("shake2");
      [[1090, 862, -1], [1235, 862, 1]].forEach(([x, y, d]) => {
        for (let k = 0; k < 4; k++) {
          const px = x + d * (20 + k * 26) * ease(t + 0.2), py = y - k * 6 - 20 * t, r = (16 - k * 2) * (1 + t);
          g.globalAlpha = Math.min(1, 1.15 * (1 - t)); g.fillStyle = k % 2 ? C.cream : "#d9c7a3";
          g.beginPath(); g.arc(Math.round(px), Math.round(py), r, 0, Math.PI * 2); g.fill();
        }
      });
      g.globalAlpha = 1;
    }
    // Sweat drop: appears when the foot goes up, slides down the hero's temple.
    if (on.sweat && n >= 18) {
      const y = 505 + Math.min(36, (n - 18) * 4);
      g.save(); g.translate(742, y); g.scale(1.7, 1.7); g.translate(-752, -y);
      g.fillStyle = C.navy; g.beginPath(); g.moveTo(752, y - 22); g.quadraticCurveTo(768, y, 752, y + 10); g.quadraticCurveTo(736, y, 752, y - 22); g.fill();
      g.fillStyle = "#9fd3e6"; g.beginPath(); g.moveTo(752, y - 16); g.quadraticCurveTo(763, y, 752, y + 6); g.quadraticCurveTo(741, y, 752, y - 16); g.fill();
      g.fillStyle = "#ffffff"; g.fillRect(748, y - 4, 3, 5); g.restore();
    }
    // Caption: the punchline after the stomp.
    if (on.caption && n >= 26) {
      g.globalAlpha = Math.min(1, (n - 25) / 2);
      g.fillStyle = "rgba(23,28,53,0.88)"; g.fillRect(0, 960, S.w, 96);
      g.fillStyle = C.cream; g.font = font(34); g.textAlign = "center"; g.fillText("YOU BROUGHT EXPERIENCE. THEY BROUGHT A CLIPBOARD.", 960, 1020);
      g.globalAlpha = 1;
    }
  };
  fxOpts.draw(scene.frame());
}
</script>
</body>
</html>
