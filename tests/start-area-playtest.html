<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lobby and Bullpen isolated playtest</title><style>html,body{margin:0;width:100%;height:100%;background:#171c35}iframe{border:0;width:100%;height:100%;display:block}aside{position:fixed;right:4px;bottom:4px;max-width:340px;background:#171c35ed;color:#fff0cf;padding:8px;font:11px monospace;z-index:99999}button{margin:2px}pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style><iframe id="game" title="Isolated start-area game"></iframe><aside><button id="check">Check slice</button><button id="lobby">Lobby</button><button id="bullpen">Bullpen</button><button id="hall">Hallway</button><button id="goals">Goals</button><button id="collision">Gate + passage</button><button id="route">Enemy doorway</button><button id="probe">Spawn probe</button><button id="stress">350 physics</button><button id="soak">Age 50 soak</button><button id="normal">Normal play</button><button id="fallback">Fallback office</button><button id="restart">Restart</button><button id="hide">Hide checks</button><pre id="report">Loading. In-memory storage; leaderboard blocked.</pre></aside><script>
const f=document.querySelector('iframe'),out=document.querySelector('#report'),R={errors:[],warnings:[],leaderboardRequests:0};let w,timer;
const say=()=>out.textContent=JSON.stringify(R,null,1),run=s=>w.eval(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
addEventListener('message',e=>{if(e.source!==f.contentWindow)return;for(const key of ['error','warning'])if(e.data[key])R[key+'s'].push(e.data[key]);if(e.data.leaderboard)R.leaderboardRequests++;say();});
(async()=>{const html=await(await fetch('../index.html?nostats=1')).text(),base=new URL('../',location.href);const safeHtml=html.replace(/<script[^>]*src="https:\/\/gc\.zgo\.at[^>]*><\/script>/g,'');const setup=`<base href="${base}"><script>window.TELEMETRY_OFF=true;window.goatcounter={count:()=>{}};const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),clear:()=>memory.clear()}});const oldFetch=fetch.bind(window);window.fetch=(input,opt)=>/supabase\.co|goatcounter\.com|gc\.zgo\.at/.test(String(input))?(parent.postMessage({leaderboard:true},'*'),Promise.resolve(new Response('[]',{status:200,headers:{'Content-Type':'application/json'}}))):oldFetch(input,opt);addEventListener('error',e=>parent.postMessage({error:e.message},'*'));addEventListener('unhandledrejection',e=>parent.postMessage({error:String(e.reason)},'*'));const warn=console.warn;console.warn=(...a)=>{parent.postMessage({warning:a.join(' ')},'*');warn(...a);};<\/script>`;f.srcdoc=setup+safeHtml;const poll=setInterval(()=>{w=f.contentWindow;if(!w._activeGameScene||!w._activeGameScene.worldArt||!w._activeGameScene.worldArt.active)return;clearInterval(poll);run('muted=true;voiceEnabled=false;unlockAudio=()=>{};');R.ready=true;check();},100);})();
function start(){run('if(titleOpen&&startFromTitle)startFromTitle();paused=false;_activeGameScene.physics.resume();_activeGameScene.time.paused=false;');}
function pause(){run('paused=true;_activeGameScene.physics.pause();touch.active=false;_heldKeys.clear();');}
function clean(){run('bills.getChildren().slice().forEach(e=>{if(e.tag)e.tag.destroy();e.destroy();});pings.clear(true,true);');}
function tour(name){start();pause();run(`const point=START_AREA_LAYOUT.tour[${JSON.stringify(name)}];player.setPosition(point[0],point[1]-player.height/2);player.body.updateFromGameObject();_activeGameScene.cameras.main.centerOn(player.x,player.y);`);}
function check(){R.slice=run(`(()=>{const a=_activeGameScene.worldArt.startArea;return {active:!!a,statsDisabled:!!window.TELEMETRY_OFF,analyticsResources:performance.getEntriesByType('resource').filter(e=>/supabase\.co|goatcounter\.com|gc\.zgo\.at/.test(e.name)).length,body:[player.body.width,player.body.height],player:[player.x,player.y],props:stageProps.length,items:a&&a.items.length,visible:a&&a.visibleProps,peak:a&&a.peakVisibleProps,gates:window.START_AREA_GATES&&START_AREA_GATES.map(g=>({id:g.id,closed:g.closed,width:g.clearWidth,body:[g.object.body.width,g.object.body.height]})),families:a&&[...new Set(a.items.filter(o=>o.sliceMeta).map(o=>o.sliceMeta.prop))],outside:a&&bills.getChildren().filter(e=>!a.contains(e.x,e.y)).length,repairs:a&&a.repairedSpawns,fps:game.loop.actualFps,age:currentAge,tax:runTaxBracket};})()`);say();}
for(const [id,name]of [['lobby','Lobby'],['bullpen','Bullpen'],['hall','Hallway'],['goals','Goals']])document.querySelector('#'+id).onclick=()=>{tour(name);check();};
document.querySelector('#check').onclick=check;
document.querySelector('#collision').onclick=async()=>{clearInterval(timer);start();clean();run('spawnTimer.paused=true;');const g=run('START_AREA_GATES[0].rect');run(`player.setPosition(${g.x+g.w+84},${g.y+g.h/2}-player.height/2);player.body.updateFromGameObject();touch.active=false;_heldKeys.add('KeyA');`);await wait(900);run('_heldKeys.clear();');R.gate=run(`({x:player.x,left:player.body.left,blocked:player.body.left>=${g.x+g.w}-1})`);run(`player.setPosition(4370-3168,2112-2448-player.height/2);player.body.updateFromGameObject();_heldKeys.add('KeyD');`);await wait(1800);run('_heldKeys.clear();');R.passage=run('({x:player.x,crossed:player.x>4480-3168+100})');pause();check();};
document.querySelector('#stress').onclick=async()=>{clearInterval(timer);tour('Bullpen');start();clean();run('spawnTimer.paused=true;fireTimer.paused=true;hp=stats.maxHp=100000;');run(`for(let i=0;i<350;i++)createEnemy(_activeGameScene,['bill','lateFee','snackAttack','officeGossip'][i%4],5000-3168+(i%20)*40,1850-2448+Math.floor(i/20)*24);`);R.stressInitial=run('bills.countActive()');run('bills.getChildren().forEach(e=>e.hp=100000);');const fps=[];for(let i=0;i<20;i++){await wait(300);fps.push(run('game.loop.actualFps'));}R.stress=run('({enemies:bills.countActive(),outside:bills.getChildren().filter(e=>!_activeGameScene.worldArt.startArea.contains(e.x,e.y)).length,visible:_activeGameScene.worldArt.startArea.peakVisibleProps})');R.stress.fps={min:Math.min(...fps.slice(3)),average:fps.slice(3).reduce((a,b)=>a+b,0)/(fps.length-3)};R.stress.scope='Real physics/navigation/animation, isolated player/enemy HP guards and firing paused, six seconds.';pause();check();};
document.querySelector('#probe').onclick=()=>{R.spawnProbe=run(`(()=>{const a=_activeGameScene.worldArt.startArea;let probes=0,bad=0;for(let y=-1100;y<900;y+=80)for(let x=-1200;x<4400;x+=80){const q=a.resolveSpawn(x,y);if(q){probes++;if(!a.contains(...q)||!NAV.reachable(...q))bad++;}}return {probes,bad,blockers:window.navExtraBlockers.length};})()`);check();};
document.querySelector('#route').onclick=async()=>{clearInterval(timer);start();clean();run('spawnTimer.paused=true;fireTimer.paused=true;hp=stats.maxHp=100000;player.setPosition(4208-3168,2112-2448-player.height/2);player.body.updateFromGameObject();');await wait(300);run("window.qaRoute=createEnemy(_activeGameScene,'bill',4700-3168,2112-2448);qaRoute.hp=100000;");const trace=[];for(let i=0;i<40;i++){await wait(200);trace.push(run('({x:qaRoute.x,y:qaRoute.y})'));}R.enemyRoute={trace,crossed:trace.some(p=>p.x<1304),outside:trace.some(p=>!run(`StartAreaArt.contains(${p.x},${p.y})`))};pause();check();};
const points=[[3168,2152],[3776,2304],[3776,2112],[4736,2112],[4736,1664],[6272,1664],[6272,1856],[7104,1856],[7104,2720],[5760,2720],[5760,3024],[4928,3024],[4928,2720],[4736,2624],[4208,2624],[3392,2624],[3392,2944],[2624,2944],[2624,2152]];
function auto(guard){clearInterval(timer);start();run('spawnTimer.paused=false;fireTimer.paused=false;');if(guard)run('hp=stats.maxHp=100000;');let index=0,max=0;const started=performance.now();R.soak={running:true,guard};timer=setInterval(()=>{run(`if(levelUpOpen&&levelMenu&&performance.now()>(window.menuInputGateUntil||0))levelMenu.pickSelected();`);const p=run('({x:player.x+3168,y:player.y+player.height/2+2448,age:currentAge,hp,dead:gameOver,n:bills.countActive(),outside:bills.getChildren().filter(e=>!_activeGameScene.worldArt.startArea.contains(e.x,e.y)).length,fps:game.loop.actualFps})');const q=points[index%points.length],dx=q[0]-p.x,dy=q[1]-p.y;if(Math.hypot(dx,dy)<44)index++;run(`touch={active:true,startX:0,startY:0,dx:${dx},dy:${dy},isTouch:true,curX:0,curY:0};`);max=Math.max(max,p.n);R.soak={...p,running:true,guard,waypoint:index,peakEnemies:max,wallSeconds:(performance.now()-started)/1000};if(p.dead||p.age>=50){clearInterval(timer);pause();R.soak.running=false;R.soak.reached50=p.age>=50;}say();},200);}
document.querySelector('#soak').onclick=()=>auto(true);document.querySelector('#normal').onclick=()=>auto(false);document.querySelector('#restart').onclick=()=>{clearInterval(timer);run('_activeGameScene.scene.restart();');setTimeout(check,1500);};document.querySelector('#fallback').onclick=()=>{clearInterval(timer);run('window.USE_START_AREA=false;_activeGameScene.scene.restart();');setTimeout(check,1500);};document.querySelector('#hide').onclick=()=>document.querySelector('aside').hidden=true;
</script>
