<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimap art review</title><style>body{margin:0;background:#171c35;color:#fff0cf;font:16px system-ui}main{max-width:920px;margin:auto;padding:16px}h1{font-size:24px}img{image-rendering:pixelated;max-width:100%;height:auto}.panel{background:#303750;padding:16px;margin:16px 0}figure{margin:12px 0}.icons{display:flex;flex-wrap:wrap;gap:16px}canvas{image-rendering:pixelated}.check{width:850px}small{color:#d3b78d}</style><main><h1>Office minimap art</h1><p>Art only. Fake floor plan for review. No game, analytics or leaderboard calls.</p><figure><img class="check" src="minimap-check-v1.png" alt="2x minimap with all eight markers and the sign beside the hero"></figure><div class="panel"><h2>Native 12px markers</h2><div class="icons" id="icons"></div><p><small>You / open door / locked door / chest / Lounge / intern / boss / found map</small></p><h2>Same markers at 2x</h2><img src="minimap-icons-v1.png" width="192" height="24" alt="Eight markers at 2x"></div><div class="panel"><h2>Sign dot loop</h2><img src="../stage/props/evac-map-v1.gif" width="144" height="192" alt="Standing evacuation map, plain and glowing red dot"><h2>Frame and buttons at 2x</h2><img src="minimap-frame-v1.png" width="128" height="128" alt="Clipboard 9-slice source"><img src="minimap-buttons-v1.png" width="96" height="48" alt="Expand and close buttons"></div><p><a style="color:#83a89a" href="README-minimap-v1.md">Frame map and integration notes</a></p></main><script>const im=new Image();im.onload=()=>{for(let i=0;i<8;i++){const c=document.createElement('canvas');c.width=c.height=12;c.setAttribute('aria-label',['you','open door','locked door','chest','Lounge','intern','boss','found map'][i]);c.getContext('2d').drawImage(im,i*12,0,12,12,0,0,12,12);document.querySelector('#icons').append(c)}};im.src='minimap-icons-v1.png';</script></html>
