<!doctype html><meta charset="utf-8"><title>Stage 2E native props at phone width</title><style>body{margin:0;background:#171c35}iframe{width:390px;height:844px;border:0;display:block}aside{position:fixed;left:420px;top:20px;color:#fff0cf;font:14px system-ui}button{margin:6px}</style><iframe title="390px native prop gallery" src="../../props/review.html"></iframe><aside><p>Isolated native gallery, 390×844. Wide table comparisons scroll at 1x.</p><button id="table">Table comparison</button><button id="right">Show hero and Bill</button><pre id="report"></pre></aside><script>const f=document.querySelector('iframe'),report=document.querySelector('pre');function inspect(){const d=f.contentDocument;report.textContent=JSON.stringify({width:f.contentWindow.innerWidth,pageWidth:d.documentElement.scrollWidth,canvasWidth:d.querySelector('#canvas-conference_table').width,visibleCards:[...d.querySelectorAll('.card')].filter(c=>!c.hidden).length},null,2);}document.querySelector('#table').onclick=()=>{f.contentDocument.querySelector('#canvas-conference_table').scrollIntoView({block:'center'});inspect();};document.querySelector('#right').onclick=()=>{const c=f.contentDocument.querySelector('#canvas-conference_table');c.parentElement.scrollLeft=c.width;inspect();};</script>
