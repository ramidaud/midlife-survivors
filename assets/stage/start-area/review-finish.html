<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art finish isolated review</title><style>html,body{margin:0;width:100%;height:100%;background:#171c35}iframe{border:0;width:100%;height:100%;display:block}aside{position:fixed;right:4px;bottom:4px;max-width:340px;background:#171c35ed;color:#fff0cf;padding:8px;font:11px monospace;z-index:99999}button{margin:2px}pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style><iframe id="game" title="Isolated start-area game"></iframe><aside><strong>ART FINISH · isolated review</strong><br><button id="check">Check finish</button><button id="open">Open all (test only)</button><button id="lobby">Lobby</button><button id="bullpen">Bullpen</button><button id="readability">Hero + Bill</button><button id="printer">Printer jam</button><button id="executive">Executive</button><button id="wellness">Wellness</button><button id="explore">Explore (no swarms)</button><button id="walk">Walk to Bullpen</button><button id="probe">Spawn probe</button><button id="stress">350 Bullpen</button><button id="hide">Hide checks</button><pre id="report">Loading. In-memory saves; stats blocked.</pre></aside><button id="show" hidden style="position:fixed;right:8px;bottom:8px;z-index:99999">Show review controls</button><script src="qa-finish-paths.js?v=110"></script><script>

const phase=new URLSearchParams(location.search).get('phase')||'after';const f=document.querySelector('iframe'),out=document.querySelector('#report'),R={phase,errors:[],warnings:[],leaderboardRequests:0};let w,timer;
const say=()=>out.textContent=JSON.stringify(R,null,1),run=s=>w.eval(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
addEventListener('message',e=>{if(e.source!==f.contentWindow)return;for(const key of ['error','warning'])if(e.data[key])R[key+'s'].push(e.data[key]);if(e.data.stack)(R.stacks||(R.stacks=[])).push(e.data.stack);if(e.data.leaderboard)R.leaderboardRequests++;say();});
(async()=>{const html=await(await fetch('../../../index.html?nostats=1')).text(),base=new URL('../../../',location.href);let safeHtml=html.replace(/<script[^>]*src="https:\/\/gc\.zgo\.at[^>]*><\/script>/g,'');if(phase==='before')safeHtml=safeHtml.replace('src/loader.js?v=','assets/stage/start-area/qa-finish/before-loader.js?v=');const setup=`<base href="${base}"><script>window.TELEMETRY_OFF=true;window.goatcounter={count:()=>{}};const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),clear:()=>memory.clear()}});const oldFetch=fetch.bind(window);window.fetch=(input,opt)=>/supabase\.co|goatcounter\.com|gc\.zgo\.at/.test(String(input))?(parent.postMessage({leaderboard:true},'*'),Promise.resolve(new Response('[]',{status:200,headers:{'Content-Type':'application/json'}}))):oldFetch(input,opt);addEventListener('error',e=>parent.postMessage({error:e.message,stack:e.error&&e.error.stack},'*'));addEventListener('unhandledrejection',e=>parent.postMessage({error:String(e.reason)},'*'));const warn=console.warn;console.warn=(...a)=>{parent.postMessage({warning:a.join(' ')},'*');warn(...a);};<\/script>`;f.srcdoc=setup+safeHtml;const poll=setInterval(()=>{w=f.contentWindow;if(!w._activeGameScene||!w._activeGameScene.worldArt||!w._activeGameScene.worldArt.startArea)return;clearInterval(poll);run('muted=true;voiceEnabled=false;unlockAudio=()=>{};');R.ready=true;document.querySelectorAll('aside button').forEach(b=>b.disabled=false);check();},100);})();
function start(){run('if(titleOpen&&startFromTitle)startFromTitle();paused=false;_activeGameScene.physics.resume();_activeGameScene.time.paused=false;spawnTimer.paused=true;fireTimer.paused=true;hp=stats.maxHp=100000;');}

function check(){R.slice=run(`(()=>{const a=_activeGameScene.worldArt.startArea;return {version:GAME_VERSION.version,build:window.BUILD,viewport:[innerWidth,innerHeight],age:currentAge,openUpToAge:PROMOTIONS.openUpToAge,statsDisabled:!!window.TELEMETRY_OFF,analyticsResources:performance.getEntriesByType('resource').filter(e=>/supabase\.co|goatcounter\.com|gc\.zgo\.at/.test(e.name)).length,player:[player.x,player.y],body:[player.body.width,player.body.height],props:stageProps.length,nativeFloorDecor:!!window.FINISH_DECOR,deskCount:START_AREA_LAYOUT.placements.filter(p=>p.prop.startsWith('desk_')).length,visible:a.visibleProps,peak:a.peakVisibleProps,navBlockers:navExtraBlockers.length,gates:START_AREA_GATES.map(g=>({id:g.id,age:g.age,closed:g.closed,width:g.clearWidth,sameBlocker:g.closed?navExtraBlockers.includes(g.rect):!navExtraBlockers.includes(g.rect)})),outside:bills.getChildren().filter(e=>!a.contains(e.x,e.y)).length,fps:game.loop.actualFps};})()`);say();}
document.querySelector('#probe').onclick=async()=>{tour('Bullpen');start();await wait(1000);pause();clean();R.spawnProbe=run(`(()=>{const a=_activeGameScene.worldArt.startArea,D=START_AREA_LAYOUT,B=D.bounds;let probes=0,bad=0,overlaps=0,offFloor=0,lockedRoomBirths=0;for(let y=B.y+48;y<B.y+B.height;y+=160)for(let x=B.x+48;x<B.x+B.width;x+=160){const q=a.resolveSpawn(x,y);if(!q)continue;probes++;if(!a.contains(...q)||!NAV.reachable(...q))bad++;const floor=D.floors.find(r=>q[0]>=r.x&&q[0]<r.x+r.width&&q[1]>=r.y&&q[1]<r.y+r.height&&r.district);if(floor&&START_AREA_GATES.some(g=>g.toDistrict===floor.district&&g.closed))lockedRoomBirths++;const e=createEnemy(_activeGameScene,'officeGossip',...q);if(!e)continue;e.body.updateFromGameObject();const b=e.body;if(a.bodies.some(o=>o.active&&o.body&&o.body.enable&&b.left<o.body.right&&b.right>o.body.left&&b.top<o.body.bottom&&b.bottom>o.body.top))overlaps++;if(![[b.left,b.top],[b.right,b.top],[b.left,b.bottom],[b.right,b.bottom]].every(p=>a.contains(...p)))offFloor++;if(e.tag)e.tag.destroy();e.destroy();}return {probes,bad,overlaps,offFloor,lockedRoomBirths,padding:a.spawnPadding};})()`);R.spawnProbe.passed=R.spawnProbe.probes>0&&['bad','overlaps','offFloor','lockedRoomBirths'].every(k=>R.spawnProbe[k]===0);check();};
function walk(name){clearInterval(timer);start();clean();const path=FINISH_QA_PATHS[name];run(`player.setPosition(${path[0][0]},${path[0][1]});player.body.updateFromGameObject();`);let i=1;const started=performance.now();R.walk={room:name,running:true,waypoint:i,total:path.length};timer=setInterval(()=>{const p=run('({x:player.x,y:player.y,outside:!_activeGameScene.worldArt.startArea.contains(player.x,player.y+player.height/2)})');let q=path[i];if(Math.hypot(q[0]-p.x,q[1]-p.y)<7){i++;if(i===path.length){clearInterval(timer);pause();R.walk={room:name,running:false,passed:true,seconds:(performance.now()-started)/1000,waypoint:i,total:path.length};check();return;}q=path[i];}run(`touch={active:true,startX:0,startY:0,dx:${100*(q[0]-p.x)},dy:${100*(q[1]-p.y)},isTouch:true,curX:0,curY:0};`);R.walk={room:name,running:true,waypoint:i,total:path.length,seconds:(performance.now()-started)/1000,position:p};if(p.outside||performance.now()-started>100000){clearInterval(timer);pause();R.walk.running=false;R.walk.passed=false;R.walk.target=q;R.walk.nearby=run(`_activeGameScene.worldArt.startArea.bodies.filter(o=>o.active&&o.body&&o.body.enable&&Math.abs(o.body.center.x-player.x)<150&&Math.abs(o.body.center.y-player.y)<150).map(o=>({id:o.sliceId,x:o.body.x,y:o.body.y,w:o.body.width,h:o.body.height}))`);}say();},40);}
