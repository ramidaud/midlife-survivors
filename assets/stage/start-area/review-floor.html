<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courtyard floor dressing review</title><style>html,body{margin:0;width:100%;height:100%;background:#171c35}iframe{border:0;width:100%;height:100%;display:block}aside{position:fixed;right:4px;bottom:4px;max-width:340px;background:#171c35ed;color:#fff0cf;padding:8px;font:11px monospace;z-index:99999}button{margin:2px}pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style><iframe id="game" title="Isolated start-area game"></iframe><aside><strong>FLOOR DRESSING · isolated review</strong><br><button id="lobby">Lobby runner</button><button id="commons">Commons</button><button id="aisle">Bullpen aisle</button><button id="readability">Hero, Bill and gem</button><button id="explore">Explore</button><button id="stress">350 enemies</button><button id="hide">Hide checks</button><pre id="report">Loading. In-memory saves; stats blocked.</pre></aside><button id="show" hidden style="position:fixed;right:8px;bottom:8px;z-index:99999">Show review controls</button><script>

(async()=>{const html=await(await fetch('../../../index.html?nostats=1')).text(),base=new URL('../../../',location.href);let safeHtml=html.replace(/<script[^>]*src="https:\/\/gc\.zgo\.at[^>]*><\/script>/g,'');if(phase==='before')safeHtml=safeHtml.replace('src/loader.js?v=','assets/stage/start-area/qa-floor/before-loader.js?v=');const setup=`<base href="${base}"><script>window.TELEMETRY_OFF=true;window.goatcounter={count:()=>{}};const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),clear:()=>memory.clear()}});const oldFetch=fetch.bind(window);window.fetch=(input,opt)=>/supabase\.co|goatcounter\.com|gc\.zgo\.at/.test(String(input))?(parent.postMessage({leaderboard:true},'*'),Promise.resolve(new Response('[]',{status:200,headers:{'Content-Type':'application/json'}}))):oldFetch(input,opt);addEventListener('error',e=>parent.postMessage({error:e.message,stack:e.error&&e.error.stack},'*'));addEventListener('unhandledrejection',e=>parent.postMessage({error:String(e.reason)},'*'));const warn=console.warn;console.warn=(...a)=>{parent.postMessage({warning:a.join(' ')},'*');warn(...a);};<\/script>`;f.srcdoc=setup+safeHtml;const poll=setInterval(()=>{w=f.contentWindow;if(!w._activeGameScene||!w._activeGameScene.worldArt||!w._activeGameScene.worldArt.startArea)return;clearInterval(poll);run('muted=true;voiceEnabled=false;unlockAudio=()=>{};');R.ready=true;document.querySelectorAll('aside button').forEach(b=>b.disabled=false);check();},100);})();
function start(){run('if(titleOpen&&startFromTitle)startFromTitle();paused=false;_activeGameScene.physics.resume();_activeGameScene.time.paused=false;spawnTimer.paused=true;fireTimer.paused=true;hp=stats.maxHp=100000;');}

return {decals:a.data.floorDecor.filter(d=>d.kind==='courtyard-decal').length,bakedFloors:_activeGameScene.children.list.filter(o=>o.texture?.key?.startsWith('slice_bake_')).length,seats:seats.length,chairOrder,standing:sceneActors.length,standingNonSolid:sceneActors.every(o=>o&&!o.body),lights:a.data.lights?.length||0,version:GAME_VERSION.version,build:window.BUILD,viewport:[innerWidth,innerHeight],age:currentAge,openUpToAge:PROMOTIONS.openUpToAge,statsDisabled:!!window.TELEMETRY_OFF,analyticsResources:performance.getEntriesByType('resource').filter(e=>/supabase\.co|goatcounter\.com|gc\.zgo\.at/.test(e.name)).length,player:[player.x,player.y],body:[player.body.width,player.body.height],props:stageProps.length,nativeFloorDecor:!!window.FINISH_DECOR,deskCount:a.data.officeLoop?.workstations.length??a.data.placements.filter(p=>p.prop.startsWith('desk_')).length,visible:a.visibleProps,peak:a.peakVisibleProps,navBlockers:navExtraBlockers.length,gates:START_AREA_GATES.map(g=>({id:g.id,age:g.age,closed:g.closed,width:g.clearWidth,sameBlocker:g.closed?navExtraBlockers.includes(g.rect):!navExtraBlockers.includes(g.rect)})),outside:bills.getChildren().filter(e=>!a.contains(e.x,e.y)).length,fps:game.loop.actualFps};})()`);say();}
