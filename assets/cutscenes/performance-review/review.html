<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Performance Review cutscene art</title><style>*{box-sizing:border-box}body{margin:0;background:#171c35;color:#f2d7a1;font:16px/1.5 system-ui}main{max-width:1280px;padding:16px;margin:auto}canvas,img{display:block;width:100%;height:auto;image-rendering:pixelated}button{font:inherit;background:#3e7775;color:#fff0cf;border:1px solid #83a89a;padding:8px}a{color:#83a89a}p{max-width:65ch}</style><main><h1>Performance Review</h1><p>Four-second intro. Three hero poses, four boss poses. The clipboard face and chart stay fixed. Art preview only.</p><button id="toggle">Pause</button><p id="beat">Loading art…</p><canvas width="1920" height="1080"></canvas><p><a href="contact-sheet.png">Contact sheet</a> · <a href="manifest.json">Manifest</a></p><img src="contact-sheet.png" alt="Seven registered frames and composite"></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let running=true,start=0,held=0,frames={};window.__performanceReview={ready:false};
const names=['plate',...['hero-01','hero-02','hero-03','review-01','review-02','review-03','review-04']];
Promise.all(names.map(async n=>{const im=new Image();im.src=n+'.png';await im.decode();frames[n]=im})).then(()=>{window.__performanceReview={ready:true,decoded:names.length};document.body.dataset.result='passed';requestAnimationFrame(tick)}).catch(e=>{document.body.dataset.result='failed';console.error(e)});
function paint(t){let h,b,label;if(t<1000){h='hero-01';b='review-01';label='Formal introduction'}else if(t<2000){h='hero-02';b='review-02';label='A very important clipboard'}else if(t<2500){h='hero-02';b='review-03';label='Make an impression: foot up'}else if(t<3000){h='hero-02';b='review-04';label='Make an impression: stomp'}else{h='hero-03';b='review-01';label='Not intimidated, much'}ctx.clearRect(0,0,1920,1080);for(const n of ['plate',h,b])ctx.drawImage(frames[n],0,0);document.querySelector('#beat').textContent=label;window.__performanceReview.beat=[h,b]}
function tick(t){if(!start)start=t;const elapsed=running?(t-start)%4000:held;paint(elapsed);requestAnimationFrame(tick)}document.querySelector('#toggle').onclick=()=>{running=!running;if(!running)held=(performance.now()-start)%4000;else start=performance.now()-held;document.querySelector('#toggle').textContent=running?'Pause':'Play'};
</script>
