<rect width="1600" height="1120" fill="#171C35"/>
<text x="40" y="52" fill="#F2D7A1" font-size="30" font-weight="700">STAGE 2: HOME · MAPLE HOLLOW (working name, layout draft)</text>
<text x="40" y="82" fill="#B8C0D4" font-size="16">Peak-fall northeastern suburb. Areas open by age, like office promotions. Numbers = the age each area opens.</text>

<g transform="translate(40,110)">
