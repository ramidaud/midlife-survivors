<text x="40" y="1048" fill="#F2D7A1" font-size="18" font-weight="700">NEIGHBOR JOKES (draft, swap freely)</text>
<text x="40" y="1078" fill="#FFF0CF" font-size="15">1. Inflatable yard ghosts, all deflated by noon</text>
<text x="40" y="1104" fill="#FFF0CF" font-size="15">2. HOA-perfect lawn, edges trimmed with a ruler</text>
<text x="40" y="1130" fill="#FFF0CF" font-size="15">3. A boat in the driveway that has never moved</text>
<text x="40" y="1156" fill="#FFF0CF" font-size="15">4. Garage band: four dads, one song, every Saturday</text>
<text x="40" y="1182" fill="#FFF0CF" font-size="15">5. The leaf blower guy (7 a.m., every day)</text>
<text x="40" y="1208" fill="#FFF0CF" font-size="15">6. Kids' street hockey net that never leaves the street</text>
<text x="940" y="1078" fill="#FFF0CF" font-size="15">7. Halloween decorations still up from last year</text>
<text x="940" y="1104" fill="#FFF0CF" font-size="15">8. Forty pumpkins and nine wind chimes</text>
<text x="940" y="1130" fill="#FFF0CF" font-size="15">9. For sale forever; the price sign keeps dropping</text>
<text x="940" y="1156" fill="#FFF0CF" font-size="15">10. Delivery boxes stacked taller than the door</text>
<text x="940" y="1182" fill="#FFF0CF" font-size="15">11. Exercise bike in the window, used as a clothes rack</text>
<text x="940" y="1208" fill="#FFF0CF" font-size="15">12. Little free library: six copies of one self-help book</text>
<text x="1520" y="1078" fill="#B8C0D4" font-size="14">K = spare key under the fake rock</text>
<text x="1520" y="1102" fill="#B8C0D4" font-size="14">(or with a neighbor, or in the minivan)</text>
