 <pattern id="road" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#303750"/></pattern>
 <pattern id="lot" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#526078"/><line x1="0" y1="0" x2="0" y2="30" stroke="#B8C0D4" stroke-width="2"/></pattern>
 <g id="tree"><circle r="18" fill="#C45C4B"/><circle r="12" cx="-6" cy="-5" fill="#EF9347"/></g>
