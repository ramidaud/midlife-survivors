</g>
<text x="40" y="1050" fill="#B8C0D4" font-size="15">Run still goes 40 to 65. Bosses: Mortgage (driveway), Midlife Crisis V8 (garage), Fifth-Grade Math Homework (school). Lemonade Stand = the shop.</text>
<text x="40" y="1078" fill="#B8C0D4" font-size="15">Hazards: LEGO bricks (kid's room), leaf piles, runaway carts, school pickup line. Everything here is a draft to react to.</text>
</svg>
