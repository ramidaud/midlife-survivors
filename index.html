<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; margin: 0; background: #1b1f38; overflow: hidden; touch-action: none; color-scheme: dark; font-family: 'Chakra Petch', sans-serif; }
  #game { position: fixed; inset: 0; }
  #game > canvas:not(#three-overlay) { position: relative; z-index: 1; }

  /* =========================================================================
     CHAMELEON + CORPORATE SATIRE UI OVERLAY (#ui-layer)
     Theme 0: 16-Bit Retro Pixel ("CORP-OS v1.98")
     Theme 1: Stylistic Indie Diablo 3/4 ("SANCTUARY HR")
     Theme 2: AAA 3D Fortnite Action ("MIDLIFE ROYALE")
     ========================================================================= */
  #ui-layer {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    --bg-pod: rgba(18, 21, 42, 0.90);
    --border-col: #f0a24f;
    --accent: #ffe042;
    --text-main: #f2f4fa;
    --text-muted: #9aa6c8;
    --hp-grad: linear-gradient(90deg, #d9383a, #ff6b52);
    --xp-grad: linear-gradient(90deg, #2b82d9, #6be2ff);
    --font-head: 'Press Start 2P', monospace;
    --font-body: 'Chakra Petch', monospace;
    --pod-radius: 4px;
    --pod-skew: 0deg;
    --pod-shadow: 4px 4px 0px #090b14;
  }

  /* Theme 1: Diablo 3/4 Stylistic Indie */
  #ui-layer[data-theme="1"] {
    --bg-pod: rgba(12, 10, 19, 0.92);
    --border-col: #c99b49;
    --accent: #f5c96b;
    --hp-grad: linear-gradient(90deg, #6e0a14, #d92638);
    --xp-grad: linear-gradient(90deg, #4b2d99, #9d75ff);
    --font-head: 'Cinzel', serif;
    --pod-radius: 2px;
    --pod-shadow: 0 8px 24px rgba(0,0,0,0.85), inset 0 0 12px rgba(201,155,73,0.18);
  }

  /* Theme 2: Fortnite AAA 3D Action */
  #ui-layer[data-theme="2"] {
    --bg-pod: rgba(16, 28, 62, 0.78);
    --border-col: #00e5ff;
    --accent: #ffe600;
    --hp-grad: linear-gradient(90deg, #00e676, #69f0ae);
    --xp-grad: linear-gradient(90deg, #00b0ff, #e040fb);
    --font-head: 'Bungee', sans-serif;
    --pod-radius: 10px;
    --pod-skew: -4deg;
    --pod-shadow: 0 10px 28px rgba(0, 229, 255, 0.22);
  }

  .hidden { display: none !important; }

  /* =========================================================================
     BROADCAST LOWER-THIRD HUD CONSOLE & CONTEXTUAL STORY/HELP TICKER
     Anchored at the bottom of the viewport so the top 82% of the screen
     (and the 3D horizon skyline!) stays completely unobstructed.
     ========================================================================= */
  .hud-lower-third {
    margin-top: auto;
    align-self: center;
    width: min(1220px, 98vw);
    padding: 0 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 12;
  }

  /* Upper Lip of Lower Third: Contextual Story & In-Game Help Ticker */
  .context-ticker {
    background: rgba(10, 13, 28, 0.94);
    border: 2px solid var(--border-col);
    border-radius: var(--pod-radius);
    box-shadow: var(--pod-shadow);
    backdrop-filter: blur(8px);
    transform: skewX(var(--pod-skew));
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    pointer-events: auto;
    transition: border-color 0.22s ease, box-shadow 0.22s ease;
  }
  .context-ticker.ctx-urgent {
    border-color: #ff4757;
    box-shadow: 0 0 18px rgba(255, 71, 87, 0.45);
  }
  .context-ticker.ctx-loot {
    border-color: #52bf6a;
    box-shadow: 0 0 18px rgba(82, 191, 106, 0.4);
  }
  .ctx-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1.25;
    min-width: 0;
  }
  .ctx-badge {
    font-family: var(--font-head);
    font-size: 9px;
    color: #0d1021;
    background: var(--accent);
    padding: 4px 8px;
    border-radius: 3px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .context-ticker.ctx-urgent .ctx-badge { background: #ff4757; color: #ffffff; }
  .context-ticker.ctx-loot .ctx-badge { background: #52bf6a; color: #0d1021; }

  .ctx-story {
    font-size: 12px;
    color: var(--text-main);
    font-style: italic;
    font-weight: 600;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ctx-help {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 4px 10px;
    border-radius: 4px;
    flex: 1;
    text-align: right;
    line-height: 1.25;
  }

  /* Main 3-Module Lower-Third Deck */
  .lower-third-deck {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 8px;
    width: 100%;
  }
  .hud-pod {
    background: var(--bg-pod);
    border: 2px solid var(--border-col);
    border-radius: var(--pod-radius);
    box-shadow: var(--pod-shadow);
    backdrop-filter: blur(8px);
    transform: skewX(var(--pod-skew));
    padding: 7px 12px;
    pointer-events: auto;
    transition: all 0.22s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Left Pod: Employee ID, HP/XP Bars & Active Perks */
  .hud-left { min-width: 260px; max-width: 315px; flex: 1; }
  .id-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .id-avatar {
    width: 30px; height: 30px; border-radius: 6px;
    background: rgba(255,255,255,0.08); border: 1.5px solid var(--border-col);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .id-titles { flex: 1; line-height: 1.1; }
  .id-dept { font-size: 9px; color: var(--accent); letter-spacing: 0.6px; font-weight: 700; }
  .id-name { font-size: 12px; color: var(--text-main); font-weight: 700; }
  .id-lv {
    font-family: var(--font-head); font-size: 10px; color: #12152a;
    background: var(--accent); padding: 3px 6px; border-radius: 4px; font-weight: 700;
  }

  .bars-compact-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 3px;
  }
  .bar-row { display: flex; align-items: center; gap: 4px; }
  .bar-label { font-size: 9px; font-weight: 700; width: 18px; color: var(--text-muted); }
  .bar-track {
    flex: 1; height: 13px; background: rgba(6, 8, 18, 0.85);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .bar-fill { height: 100%; transition: width 0.16s ease-out; }
  .hp-fill { background: var(--hp-grad); }
  .xp-fill { background: var(--xp-grad); }
  .bar-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #ffffff; text-shadow: 0 1px 2px #000;
  }

  .loadout-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .perk-badge {
    font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main);
  }

  /* Center Pod: Life Chapter Timeline + On-Screen Situational Radar */
  .hud-center { flex: 1.5; padding: 7px 14px 8px; }
  .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .timeline-title { font-size: 10px; color: var(--text-muted); letter-spacing: 0.7px; font-weight: 700; }
  .timeline-age { font-family: var(--font-head); font-size: 12px; color: var(--accent); }
  .timeline-track {
    height: 9px; background: rgba(6, 8, 18, 0.9); border: 1px solid var(--border-col);
    border-radius: 5px; position: relative; margin-bottom: 14px;
  }
  .timeline-fill {
    height: 100%; background: linear-gradient(90deg, #f0a24f, #ffe042);
    border-radius: 4px; transition: width 0.2s linear;
  }
  .milestone {
    position: absolute; top: 10px; transform: translateX(-50%);
    font-size: 9px; color: var(--text-muted); font-weight: 700; white-space: nowrap;
  }
  .milestone.boss-pip { color: #ff8a82; }
  .milestone.win-pip { color: #ffe042; }
  .radar-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700; color: #cbd4f0;
    border-top: 1px solid rgba(255,255,255,0.12); padding-top: 4px;
  }
  .radar-row b { color: var(--accent); }

  /* Right Pod: 401(k) Ticker, Camera Switcher & Quick Controls */
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 4px; }
  .coin-pill {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--accent);
  }
  .style-pill {
    display: flex; align-items: center; gap: 3px;
    background: rgba(0,0,0,0.45); padding: 2px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .style-key { font-size: 10px; color: var(--accent); padding: 0 4px; font-weight: 700; }
  .style-opt {
    background: transparent; border: none; color: var(--text-muted);
    font-family: var(--font-body); font-size: 10px; font-weight: 700;
    padding: 3px 6px; border-radius: 3px; cursor: pointer;
  }
  .style-opt.active { background: var(--border-col); color: #0d1021; }
  .util-btns { display: flex; gap: 5px; }
  .util-btn {
    background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.28);
    color: var(--text-main); font-family: var(--font-body); font-size: 11px; font-weight: 700;
    padding: 4px 9px; min-height: 30px; border-radius: 5px; cursor: pointer;
    touch-action: manipulation;
  }
  .util-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* UNIVERSAL KEYBOARD & CONTROLLER FOCUS HIGHLIGHT (.nav-focused) */
  .nav-focused {
    outline: 3px solid var(--accent) !important;
    outline-offset: 2px !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 20px rgba(255, 224, 66, 0.65) !important;
    transform: translateY(-2px) scale(1.025) !important;
    z-index: 6;
  }
  .nav-hint-bar {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-size: 11px; color: var(--text-muted); font-weight: 700;
    display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  .nav-hint-bar b { color: var(--accent); }

  /* PAUSE & OPTIONS MENU LIST */
  .options-list {
    display: flex; flex-direction: column; gap: 8px; margin: 12px 0 6px;
  }
  .opt-btn {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(10, 13, 28, 0.92); border: 2px solid rgba(255,255,255,0.22);
    color: var(--text-main); border-radius: var(--pod-radius);
    font-family: var(--font-body); font-size: 14px; font-weight: 700;
    padding: 12px 16px; cursor: pointer; text-align: left; width: 100%;
    transition: all 0.12s ease; touch-action: manipulation;
  }
  .opt-btn span.opt-val {
    font-family: var(--font-head); font-size: 11px; color: var(--accent);
    background: rgba(255,255,255,0.1); padding: 4px 9px; border-radius: 4px;
  }
  .opt-btn.primary-opt {
    background: var(--border-col); color: #0d1021; border-color: var(--border-col);
    font-family: var(--font-head); font-size: 13px; justify-content: center;
  }

  /* MOBILE FLOATING QUICK-CONTROLS & VIRTUAL TOUCH JOYSTICK */
  .mobile-dock {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    display: none; gap: 6px; pointer-events: auto;
  }
  .mob-fab {
    background: var(--bg-pod); border: 2px solid var(--border-col);
    color: var(--text-main); border-radius: 999px;
    font-family: var(--font-body); font-size: 12px; font-weight: 700;
    padding: 8px 12px; min-height: 40px; min-width: 40px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    cursor: pointer; touch-action: manipulation;
  }
  .mob-fab:active { transform: scale(0.94); border-color: var(--accent); }

  .touch-joystick {
    position: fixed; width: 96px; height: 96px; margin-left: -48px; margin-top: -48px;
    border-radius: 50%; border: 2px solid rgba(255, 224, 66, 0.55);
    background: rgba(12, 16, 34, 0.38); pointer-events: none; z-index: 15;
  }
  .touch-joystick.fixed-pad {
    margin: 0; pointer-events: none;
    border-color: rgba(255, 224, 66, 0.72);
    background: rgba(12, 16, 34, 0.52);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
  }
  .touch-knob {
    position: absolute; left: 50%; top: 50%; width: 38px; height: 38px;
    margin-left: -19px; margin-top: -19px; border-radius: 50%;
    background: rgba(255, 224, 66, 0.85); box-shadow: 0 0 12px rgba(255, 224, 66, 0.8);
  }
  .mobile-dock.dock-left {
    right: auto; left: 12px;
  }
  .pointer-target {
    position: fixed; width: 28px; height: 28px; margin-left: -14px; margin-top: -14px;
    border-radius: 50%; border: 2px dashed var(--accent);
    background: rgba(255, 224, 66, 0.14); pointer-events: none; z-index: 14;
    box-shadow: 0 0 12px rgba(255, 224, 66, 0.45);
  }

  /* INPUT & CONTROLS CONFIGURATION MODAL */
  .controls-box { max-width: 780px; padding: 18px 22px; }
  .device-status-bar {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
    margin: 6px 0 12px;
  }
  .device-pill {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.22);
    color: var(--text-muted);
  }
  .device-pill.ready {
    border-color: #6fbf73; color: #8ff094; background: rgba(40, 95, 48, 0.32);
  }
  .controls-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: left;
    margin-bottom: 12px;
  }
  .ctrl-section {
    background: rgba(8, 11, 24, 0.72); border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: var(--pod-radius); padding: 10px 12px;
  }
  .ctrl-sec-title {
    font-family: var(--font-head); font-size: 11px; color: var(--accent);
    margin-bottom: 8px; letter-spacing: 0.6px; border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 5px;
  }
  .ctrl-rows { display: flex; flex-direction: column; gap: 6px; }
  .ctrl-btn {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: rgba(16, 20, 42, 0.92); border: 1.5px solid rgba(255,255,255,0.2);
    color: var(--text-main); border-radius: 4px;
    font-family: var(--font-body); font-size: 12px; font-weight: 700;
    padding: 7px 10px; cursor: pointer; width: 100%; text-align: left;
    touch-action: manipulation;
  }
  .ctrl-btn .ctrl-val {
    font-family: var(--font-head); font-size: 10px; color: var(--accent);
    background: rgba(255,255,255,0.1); padding: 3px 7px; border-radius: 3px;
    white-space: nowrap;
  }
  .ctrl-btn.listening {
    border-color: #ff5252 !important;
    background: rgba(88, 16, 24, 0.92) !important;
  }
  .ctrl-btn.listening .ctrl-val {
    background: #ff5252; color: #ffffff;
  }
  .controls-actions {
    display: flex; gap: 10px; margin-top: 8px;
  }

  /* BOSS OUTLOOK TOAST */
  .boss-toast {
    align-self: center; margin-top: 4px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(45, 8, 18, 0.94); border: 2px solid #ff3b4e;
    border-radius: var(--pod-radius); box-shadow: 0 8px 28px rgba(255, 46, 76, 0.45);
    padding: 10px 18px; animation: popIn 0.25s ease-out;
  }
  .toast-icon { font-size: 26px; }
  .toast-sub { font-size: 10px; color: #ff99a4; font-weight: 700; letter-spacing: 0.8px; }
  .toast-title { font-family: var(--font-head); font-size: 14px; color: #ffe042; margin-top: 2px; }

  /* MODALS (Level-Up, Title Dossier, Pause, Game Over) */
  .ui-modal {
    position: fixed; inset: 0; z-index: 30; pointer-events: auto;
    background: rgba(8, 10, 22, 0.78); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    touch-action: pan-y;
  }
  .modal-card {
    background: var(--bg-pod); border: 3px solid var(--border-col);
    border-radius: var(--pod-radius); box-shadow: var(--pod-shadow);
    padding: 20px 24px; width: 100%; max-width: 680px; max-height: 92vh; max-height: 92dvh; overflow-y: auto;
    text-align: center; -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain;
    transform: skewX(var(--pod-skew)); animation: popIn 0.2s ease-out;
  }
  .modal-kicker { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 1.2px; margin-bottom: 4px; }
  .modal-title { font-family: var(--font-head); font-size: 20px; color: var(--text-main); margin: 4px 0 6px; }
  .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

  /* 3 VERTICAL PERK CARDS SIDE-BY-SIDE */
  .perk-cards-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .perk-card {
    background: rgba(10, 13, 28, 0.92); border: 2px solid rgba(255,255,255,0.22);
    border-radius: var(--pod-radius); padding: 14px 10px 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    cursor: pointer; transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    min-height: 205px;
  }
  .perk-card:hover, .perk-card.selected {
    transform: translateY(-6px) scale(1.03);
    border-color: var(--accent);
    box-shadow: 0 8px 22px rgba(255, 224, 66, 0.28);
    background: rgba(34, 42, 82, 0.95);
  }
  .perk-card.rarity-unlock { border-color: #5fb3f0; }
  .perk-card.rarity-boost { border-color: #5fd39c; }
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 52vh; overflow-y: auto; margin: 8px 0; text-align: left; }
  .ach-tile { border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 8px; background: rgba(255,255,255,0.04); }
  .ach-tile.got { border-color: #f5c542; background: rgba(245,197,66,0.08); }
  .ach-tile.locked { opacity: 0.6; }
  .ach-icon { font-size: 20px; }
  .ach-name { font-weight: 700; font-size: 12px; margin: 2px 0; }
  .ach-desc { font-size: 11px; opacity: 0.8; }

  .lb-tax { font-size: 9px; color: #ff8a5b; font-weight: 700; }
  .go-ach { margin: 8px 0; font-size: 12px; color: #f5c542; text-align: center; }
  .perk-card.rarity-evo {

  }
  .title-mode-blurb { font-size: 12px; opacity: 0.75; text-align: center; margin: 2px 0 6px; }
  .perk-card.armed { outline: 3px solid #ffe042; outline-offset: 2px; transform: translateY(-3px); }

  .perk-ribbon {
    font-size: 9px; font-weight: 700; letter-spacing: 0.7px;

  }
  .perk-icon { font-size: 38px; margin: 10px 0 6px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
  .px-icon { display: inline-block; background-repeat: no-repeat; image-rendering: pixelated; vertical-align: middle; }
  .id-avatar { overflow: hidden; }
  .perk-name { font-family: var(--font-head); font-size: 12px; color: var(--text-main); line-height: 1.3; margin-bottom: 6px; }
  .perk-desc { font-size: 12px; color: #cbd4f0; line-height: 1.35; flex: 1; }
  .perk-key {
    margin-top: 10px; font-size: 10px; font-weight: 700; color: #12152a;
    background: var(--border-col); padding: 3px 10px; border-radius: 3px;
  }

  /* TITLE SCREEN DOSSIER & 401(k) SHOP */
  .title-box { max-width: 720px; padding: 18px 22px; }
  .title-top-banner {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.14);
    padding-bottom: 6px; margin-bottom: 8px;
  }
  .dossier-stamp { color: #ff8a82; font-weight: 700; letter-spacing: 0.8px; }
  .dossier-balance b { color: var(--accent); font-size: 13px; }
  .game-logo {
    font-family: var(--font-head); font-size: 26px; color: var(--border-col);
    margin: 4px 0; text-shadow: 0 3px 0 #090b14;
  }
  .game-tagline { font-size: 12px; color: #cbd4f0; margin: 0 0 6px; }
  .version-stamp-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    margin: 0 auto 10px; padding: 5px 12px;
    background: rgba(8, 11, 24, 0.78); border: 1.5px solid rgba(255, 224, 66, 0.38);
    border-radius: 999px; width: fit-content; max-width: 100%;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }
  .version-pill {
    font-size: 11px; color: #cbd4f0; letter-spacing: 0.4px;
  }
  .version-pill b {
    color: var(--accent); font-family: var(--font-head); font-size: 10px;
  }
  .version-notes-btn {
    border-color: var(--accent) !important; color: var(--accent) !important;
    background: rgba(255, 224, 66, 0.12) !important;
    padding: 3px 9px !important; border-radius: 999px !important; font-size: 10px !important;
  }
  .version-notes-btn:hover {
    background: var(--accent) !important; color: #0d1021 !important;
  }

  /* CHANGELOG / PATCH NOTES MODAL */
  .changelog-box { max-width: 700px; padding: 18px 22px; text-align: left; }
  .changelog-box .modal-kicker, .changelog-box .modal-title, .changelog-box .modal-sub { text-align: center; }
  .changelog-list {
    display: flex; flex-direction: column; gap: 10px; max-height: 54vh; overflow-y: auto;
    margin: 10px 0 14px; padding-right: 4px;
  }
  .changelog-entry {
    background: rgba(8, 11, 24, 0.82); border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: var(--pod-radius); padding: 10px 14px;
  }
  .changelog-entry.latest {
    border-color: var(--accent);
    background: linear-gradient(90deg, rgba(48, 38, 12, 0.55), rgba(10, 14, 30, 0.9));
  }
  .changelog-header {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 5px; margin-bottom: 6px;
  }
  .changelog-ver {
    font-family: var(--font-head); font-size: 11px; color: #0d1021;
    background: var(--accent); padding: 3px 8px; border-radius: 4px;
  }
  .changelog-date { font-size: 11px; font-weight: 700; color: var(--accent); }
  .changelog-title { font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
  .changelog-notes {
    margin: 0; padding-left: 18px; font-size: 11.5px; color: #cbd4f0; line-height: 1.45;
  }
  .changelog-notes li { margin-bottom: 3px; }

  /* SUBJECT BIO PREVIEW STRIP ON TITLE DOSSIER */
  .subject-bio-strip {
    background: rgba(8, 11, 24, 0.85); border: 1.5px solid rgba(255, 224, 66, 0.32);
    border-radius: var(--pod-radius); padding: 7px 11px; margin-top: 6px;
    text-align: left; font-size: 11px; line-height: 1.38; color: #cbd4f0;
  }
  .subject-bio-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 3px;
  }
  .subject-bio-code { font-family: var(--font-head); font-size: 9.5px; color: var(--accent); letter-spacing: 0.6px; }
  .subject-bio-real { font-weight: 700; color: #ffffff; font-size: 11px; }
  .subject-bio-quote {
    margin-top: 4px; color: var(--accent); font-style: italic; font-size: 10.5px;
  }

  /* MYTHOS, SUBJECTS & SCENARIOS LORE ARCHIVE MODAL */
  .lore-box { max-width: 760px; padding: 18px 22px; text-align: left; }
  .lore-box .modal-kicker, .lore-box .modal-title, .lore-box .modal-sub { text-align: center; }
  .lore-tabs {
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px;
  }
  .lore-tab-btn {
    background: rgba(10, 13, 28, 0.9); border: 1.5px solid rgba(255,255,255,0.24);
    color: var(--text-main); font-family: var(--font-head); font-size: 10px;
    padding: 7px 12px; border-radius: 5px; cursor: pointer;
  }
  .lore-tab-btn.active {
    background: var(--accent); color: #0d1021; border-color: var(--accent);
  }
  .lore-content {
    display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow-y: auto;
    margin-bottom: 12px; padding-right: 4px;
  }
  .lore-card {
    background: rgba(8, 11, 24, 0.84); border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: var(--pod-radius); padding: 10px 14px;
  }
  .lore-card-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 5px; margin-bottom: 6px;
  }
  .lore-card-code {
    font-family: var(--font-head); font-size: 10px; color: var(--accent);
  }
  .lore-card-title {
    font-size: 14px; font-weight: 700; color: #ffffff; margin-bottom: 4px;
  }
  .lore-card-body {
    font-size: 12px; color: #cbd4f0; line-height: 1.45; margin-bottom: 6px;
  }
  .lore-card-meta {
    font-size: 11px; color: #8ff094; font-weight: 700; margin-top: 4px;
  }
  .lore-card-quote {
    font-size: 11.5px; color: var(--accent); font-style: italic;
    background: rgba(255, 224, 66, 0.08); border-left: 3px solid var(--accent);
    padding: 5px 9px; border-radius: 3px; margin-top: 6px;
  }
  .section-label {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.8px; margin: 8px 0 6px;
  }
  .dossier-chars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dossier-char {
    background: rgba(10, 13, 28, 0.88); border: 2px solid rgba(255,255,255,0.18);
    border-radius: var(--pod-radius); padding: 8px; cursor: pointer; transition: all 0.14s ease;
  }
  .dossier-char.selected { border-color: var(--accent); background: rgba(42, 52, 98, 0.92); }
  .dossier-char:hover { transform: translateY(-2px); border-color: var(--border-col); }
  .char-emoji { font-size: 22px; }
  .char-title { font-weight: 700; font-size: 12px; color: var(--text-main); margin: 2px 0; }
  .char-desc { font-size: 10px; color: var(--text-muted); min-height: 26px; }
  .char-badge {
    display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.1); color: var(--accent);
  }

  .shop-list { display: flex; flex-direction: column; gap: 5px; }
  .shop-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(10, 13, 28, 0.85); border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: var(--pod-radius); padding: 6px 10px; cursor: pointer;
  }
  .shop-row.affordable { border-color: var(--border-col); }
  .shop-row.maxed { border-color: #6fbf73; opacity: 0.85; }
  .shop-info { display: flex; align-items: center; gap: 8px; text-align: left; font-size: 11px; }
  .shop-name { font-weight: 700; color: var(--text-main); }
  .shop-pips { color: var(--accent); letter-spacing: 1px; font-size: 11px; }
  .shop-desc { color: var(--text-muted); }
  .run-summary { margin: 10px 0 4px; padding: 10px 12px; border: 2px solid var(--border-col); border-radius: var(--pod-radius); background: rgba(10,13,28,0.75); text-align: left; font-size: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 34vh; overflow-y: auto; }
  .rs-head { font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .rs-name { font-weight: 700; color: var(--text-main); }
  .rs-line { color: var(--text-muted); line-height: 1.35; }
  .rs-coins { color: #f5c542; font-weight: 700; }
  .rs-tip, .rs-next { color: var(--text-main); line-height: 1.35; }
  .shop-refund-note { margin-top: 8px; font-size: 11px; color: var(--text-muted); text-align: center; }
  .shop-refund-btn { border-color: rgba(255,255,255,0.3); }
  .shop-buy-btn {
    background: var(--border-col); color: #12152a; border: none; border-radius: 3px;
    font-family: var(--font-body); font-size: 11px; font-weight: 700; padding: 4px 10px; cursor: pointer;
  }

  .title-footer { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .title-style-switcher {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--text-muted);
  }
  .t-style-btn {
    background: rgba(10,13,28,0.9); border: 1.5px solid rgba(255,255,255,0.22);
    color: var(--text-main); font-family: var(--font-body); font-size: 11px; font-weight: 700;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  .t-style-btn.active { background: var(--accent); color: #12152a; border-color: var(--accent); }

  .cta-btn {
    background: var(--border-col); color: #0d1021; border: none; border-radius: var(--pod-radius);
    font-family: var(--font-head); font-size: 14px; font-weight: 700;
    padding: 12px 22px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform 0.12s ease, background 0.12s ease; width: 100%;
  }
  .cta-btn:hover { transform: scale(1.02); background: var(--accent); }
  .secondary-btn { background: #5fb3f0; }

  /* GAME OVER / VICTORY */
  .gameover-cause { font-size: 15px; color: #ffffff; font-style: italic; margin: 12px 0; line-height: 1.45; }
  .gameover-stats { display: flex; justify-content: center; gap: 12px; margin: 14px 0; }
  .stat-pill {
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 5px; padding: 6px 12px; display: flex; flex-direction: column; font-size: 10px; color: var(--text-muted);
  }
  .stat-pill b { font-size: 14px; color: var(--accent); margin-top: 2px; }
  .gameover-actions { display: flex; gap: 10px; margin-top: 10px; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) skewX(var(--pod-skew)); }
    to   { opacity: 1; transform: scale(1) skewX(var(--pod-skew)); }
  }

  /* Show Floating Quick-Control Dock on all Touch / Coarse-Pointer devices & Mobile Viewports */
  @media (max-width: 900px), (pointer: coarse) {
    .mobile-dock {
      display: flex;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
    }
    .mobile-dock.dock-left {
      right: auto;
      left: max(8px, env(safe-area-inset-left));
    }
  }

  /* =========================================================================
     MOBILE PORTRAIT & TABLET RESPONSIVE SCALING (max-width: 768px)
     Keeps the Broadcast Lower-Third compact (<22% screen height) and makes
     every modal, shop row, and button thumb-friendly and scrollable.
     ========================================================================= */
  @media (max-width: 768px) {
    .hud-lower-third {
      width: 100vw;
      padding: 0 5px max(6px, env(safe-area-inset-bottom));
      gap: 4px;
    }
    .context-ticker {
      flex-direction: column; align-items: stretch; gap: 3px;
      padding: 4px 8px; transform: none;
    }
    .ctx-left { gap: 6px; }
    .ctx-badge { font-size: 8px; padding: 2px 6px; }
    .ctx-story {
      font-size: 10.5px; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      white-space: normal;
    }
    .ctx-help {
      width: 100%; text-align: left; font-size: 9.5px;
      padding: 2px 6px; line-height: 1.2;
    }

    .lower-third-deck { flex-wrap: wrap; gap: 4px; }
    .hud-pod { transform: none; padding: 5px 8px; }
    .hud-left { min-width: 175px; max-width: none; flex: 1 1 58%; }
    .id-header { gap: 6px; margin-bottom: 3px; }
    .id-avatar { width: 24px; height: 24px; font-size: 14px; }
    .id-dept { font-size: 8px; }
    .id-name { font-size: 11px; }
    .id-lv { font-size: 8.5px; padding: 2px 5px; }
    .bars-compact-grid { gap: 4px; margin-bottom: 2px; }
    .bar-track { height: 11px; }
    .bar-text { font-size: 8px; }
    .perk-badge { font-size: 8px; padding: 1px 4px; }

    /* Right pod sits compactly beside Left pod; top Mobile Dock handles Pause/Input/View/Mute */
    .hud-right {
      flex: 0 0 auto; align-items: flex-end; justify-content: center;
      padding: 5px 7px;
    }
    .coin-pill { flex-wrap: wrap; justify-content: flex-end; gap: 3px; font-size: 10.5px; }
    #hud-save-dot { display: none; }
    .style-pill, .hud-right .util-btns { display: none; }

    /* Center Timeline & Radar spans full width at the bottom of the deck */
    .hud-center {
      order: 3; width: 100%; max-width: 100%; flex: 1 1 100%;
      padding: 4px 8px 5px;
    }
    .timeline-header { margin-bottom: 3px; }
    .timeline-title { font-size: 8.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 68%; }
    .timeline-age { font-size: 10px; }
    .timeline-track { height: 7px; margin-bottom: 11px; }
    .milestone { font-size: 8px; top: 8px; }
    .radar-row { font-size: 9px; padding-top: 3px; gap: 4px; flex-wrap: wrap; }

    .mob-fab { padding: 6px 10px; min-height: 36px; min-width: 36px; font-size: 11px; }

    /* Modals & Title Dossier on Mobile Portrait */
    .ui-modal { padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom)); }
    .modal-card, .title-box, .controls-box, .lore-box, .changelog-box {
      padding: 12px 11px; transform: none; max-height: 94dvh;
    }
    .title-top-banner { font-size: 9.5px; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .game-logo { font-size: clamp(16px, 5vw, 21px); margin: 2px 0; }
    .game-tagline { font-size: 10.5px; margin-bottom: 5px; }
    .version-stamp-bar { padding: 4px 8px; gap: 5px; margin-bottom: 6px; border-radius: 10px; }
    .version-pill { font-size: 9.5px; width: 100%; text-align: center; }
    .version-notes-btn { font-size: 9px !important; padding: 4px 8px !important; }

    /* Keep 3 Subject Cards side-by-side in a compact 3-col grid on phones to save vertical height */
    .dossier-chars-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .dossier-char { padding: 6px 4px; }
    .char-emoji { font-size: 18px; }
    .char-title { font-size: 10px; line-height: 1.15; }
    .char-desc { font-size: 8.5px; line-height: 1.2; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .char-badge { font-size: 8.5px; padding: 1px 4px; }

    .subject-bio-strip { padding: 5px 8px; font-size: 10px; line-height: 1.3; }
    .subject-bio-code { font-size: 8.5px; }
    .subject-bio-real { font-size: 10px; }
    .subject-bio-quote { font-size: 9.5px; }

    .title-style-switcher { gap: 4px; font-size: 9.5px; }
    .t-style-btn { padding: 4px 7px; font-size: 9.5px; }

    .shop-row { padding: 5px 7px; gap: 6px; }
    .shop-info { flex-wrap: wrap; gap: 4px; font-size: 10px; }
    .shop-desc { width: 100%; font-size: 9.5px; }
    .shop-buy-btn { padding: 5px 8px; font-size: 10px; white-space: nowrap; }

    .cta-btn { font-size: 11.5px; padding: 11px 12px; }
    .nav-hint-bar { font-size: 9.5px; gap: 8px; margin-top: 7px; padding-top: 6px; }

    /* Level-Up Cards, Input Config & Lore Tabs on Mobile */
    .perk-cards-grid, .controls-grid { grid-template-columns: 1fr; gap: 8px; }
    .perk-card { min-height: auto; flex-direction: row; gap: 10px; text-align: left; padding: 9px 10px; }
    .perk-icon { font-size: 26px; margin: 0; }
    .perk-name { font-size: 11px; margin-bottom: 3px; }
    .perk-desc { font-size: 11px; }
    .perk-key { margin-top: 4px; padding: 2px 6px; font-size: 9px; white-space: nowrap; }

    .opt-btn { padding: 9px 11px; font-size: 12px; }
    .opt-btn span.opt-val { font-size: 9.5px; padding: 3px 6px; }
    .lore-tab-btn { font-size: 8.5px; padding: 5px 8px; }
    .lore-content, .changelog-list { max-height: 48dvh; }
    .gameover-stats { flex-wrap: wrap; gap: 6px; }
    .gameover-actions, .controls-actions { flex-direction: column; gap: 6px; }
  }

  /* =========================================================================
     MOBILE LANDSCAPE RESPONSIVE SCALING (max-height: 520px)
     Keeps the Lower-Third ultra-low-profile on horizontal phones (e.g. 844x390)
     ========================================================================= */
  @media (max-height: 520px) {
    .hud-lower-third { padding: 0 8px max(4px, env(safe-area-inset-bottom)); gap: 3px; }
    .context-ticker { flex-direction: row; padding: 3px 10px; gap: 8px; transform: none; }
    .ctx-story { font-size: 10px; white-space: nowrap; }
    .ctx-help { font-size: 9.5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 44%; }
    .lower-third-deck { flex-wrap: nowrap; gap: 5px; }
    .hud-pod { padding: 4px 8px; transform: none; }
    .hud-left { min-width: 190px; }
    .id-avatar { width: 22px; height: 22px; font-size: 13px; }
    .loadout-row { display: none; }
    .timeline-track { height: 6px; margin-bottom: 9px; }
    .milestone { font-size: 7.5px; top: 7px; }
    .radar-row { font-size: 8.5px; padding-top: 2px; }
    .style-pill, .hud-right .util-btns { display: none; }
    .modal-card, .title-box, .controls-box, .lore-box, .changelog-box {
      max-height: 94dvh; padding: 10px 14px; transform: none;
    }
    .game-logo { font-size: 16px; margin: 1px 0; }
    .perk-card { min-height: auto; padding: 8px; }
    .perk-icon { font-size: 24px; margin: 4px 0; }
  }

  /* =========================================================================
     CLEAN SCREEN HUD (Objective 1, Oct 30): Vampire Survivors-style.
     XP bar across the top, age in the middle, coins + loadout top-left,
     pause/mute top-right, HP bar drawn under the player in Phaser.
     The old lower-third console is hidden, not deleted.
     ========================================================================= */
  .hud-lower-third, .mobile-dock, #hud-lower-third { display: none !important; }
  .title-style-switcher .t-style-btn[data-v] { display: none; }
  .vs-hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 12; pointer-events: none;
    padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
    font-family: 'Press Start 2P', monospace; color: #f2f4fa;
  }
  .vs-hud.hidden { display: none; }
  .vs-xp { position: relative; height: 16px; background: rgba(8,10,22,0.85); border: 2px solid #0a0c18; box-shadow: 0 0 0 1px rgba(107,226,255,0.35); }
  .vs-xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2b82d9, #6be2ff); transition: width 0.15s linear; }

  /* Center flash: big short notices (boss, Comfort Zone Tax, buffs) placed just above the player */
  .center-flash { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 60; pointer-events: none; text-align: center;
    font-family: "Silkscreen", monospace; text-shadow: 3px 3px 0 #171C35, -1px -1px 0 #171C35; }

    18% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -56%); } }
  @media (prefers-reduced-motion: reduce) { .center-flash.cf-go { animation: cf-fade 1.9s linear forwards; } @keyframes cf-fade { 0%,75% { opacity: 1; } 100% { opacity: 0; } } }
  /* Pause menu: "Right now" active effects */

  /* Close Call streak meter (under the year bar) */

  .vs-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  /* LOWER THIRD (Objective 2, Oct 30): on-demand broadcast strip, one message at a time */
  .lt-strip {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 12;

  /* =========================================================================
     SHARED BRAND (Nov 1): the game and the devlog are one product.
     Same palette (assets/art-direction/STYLE_GUIDE.md), same fonts as devlog/styles.css:
     Silkscreen for short labels and headings, Atkinson Hyperlegible for anything you read.
     Applies to the default 2D theme (data-theme="0").
     ========================================================================= */
  :root {
    --ms-navy: #171C35; --ms-slate: #303750; --ms-teal: #3E7775; --ms-sage: #83A89A;
    --ms-cream: #F2D7A1; --ms-white: #FFF0CF; --ms-coffee: #EF9347; --ms-red: #C45C4B; --ms-muted: #B9BED6;
  }
  #ui-layer[data-theme="0"] {
    --bg-pod: rgba(23, 28, 53, 0.95);
    --border-col: var(--ms-coffee);
    --accent: var(--ms-cream);
    --text-main: var(--ms-white);
    --text-muted: var(--ms-muted);
    --font-head: 'Silkscreen', 'Press Start 2P', monospace;
    --font-body: 'Atkinson Hyperlegible', 'Chakra Petch', system-ui, sans-serif;
    --pod-shadow: 0 0 0 2px var(--ms-teal), 6px 6px 0 #0b0e1d;
    font-family: var(--font-body);

  #ui-layer[data-theme="0"] .modal-card { border-width: 3px; }

    border-left: 4px solid var(--ms-coffee); padding: 5px 10px; border-radius: 2px;
    font-family: var(--font-head); font-size: 10px; font-weight: 400; letter-spacing: 0.06em;
  }
  #ui-layer[data-theme="0"] .memo-strip {
    display: flex; gap: 8px; align-items: baseline; justify-content: center; flex-wrap: wrap;
    background: var(--ms-cream); color: var(--ms-navy); border-left: 4px solid var(--ms-coffee);
    padding: 6px 12px; border-radius: 2px; text-align: left;
  }
  #ui-layer[data-theme="0"] .memo-strip .re { font-family: var(--font-head); font-size: 10px; color: var(--ms-teal); letter-spacing: 0.06em; }
  #ui-layer[data-theme="0"] .memo-strip strong { font-family: var(--font-body); font-size: 13px; font-weight: 700; }
  #ui-layer[data-theme="0"] .game-logo { font-family: var(--font-head); color: var(--ms-coffee); letter-spacing: 0.04em; text-shadow: 3px 3px 0 var(--ms-navy); }

  #ui-layer[data-theme="0"] .game-tagline { color: var(--ms-white); }
  /* Buttons: orange primary, teal secondary (no more off-palette blue) */
  #ui-layer[data-theme="0"] .cta-btn { font-family: var(--font-head); font-weight: 400; color: var(--ms-navy); }
  #ui-layer[data-theme="0"] .cta-btn:hover { background: var(--ms-cream); }
  #ui-layer[data-theme="0"] .secondary-btn { background: var(--ms-teal); color: var(--ms-white); }
  #ui-layer[data-theme="0"] .t-style-btn { font-family: var(--font-head); font-weight: 400; letter-spacing: 0.03em; border-color: rgba(131,168,154,0.45); }
  #ui-layer[data-theme="0"] .t-style-btn.active { background: var(--ms-cream); border-color: var(--ms-cream); color: var(--ms-navy); }
  #ui-layer[data-theme="0"] .opt-btn { font-family: var(--font-body); border-color: rgba(131,168,154,0.35); }
  #ui-layer[data-theme="0"] .opt-btn span.opt-val { font-family: var(--font-head); font-weight: 400; color: var(--ms-cream); }
  #ui-layer[data-theme="0"] .opt-btn.primary-opt { font-family: var(--font-head); font-weight: 400; color: var(--ms-navy); }
  /* Focus ring: cream outline, warm glow */
  #ui-layer[data-theme="0"] .nav-focused {
    outline-color: var(--ms-cream) !important; border-color: var(--ms-cream) !important;
    box-shadow: 0 0 0 2px var(--ms-navy), 0 0 18px rgba(239,147,71,0.55) !important;
  }
  #ui-layer[data-theme="0"] .nav-hint-bar b { color: var(--ms-cream); }
  /* Title screen sits on the office key art, like the devlog hero */
  #ui-layer[data-theme="0"] #title-modal {

  #ui-layer[data-theme="0"] .title-box { background: rgba(23, 28, 53, 0.90); }

  #ui-layer[data-theme="0"] .title-links { display: flex; justify-content: center; gap: 14px; font-size: 12px; }

  #ui-layer[data-theme="0"] .perk-card { border-color: rgba(131,168,154,0.35); background: rgba(23,28,53,0.96); }

  #ui-layer[data-theme="0"] .perk-card.rarity-evo { border-color: var(--ms-coffee); background: linear-gradient(180deg, rgba(135,76,59,0.55), rgba(23,28,53,0.96)); }
  #ui-layer[data-theme="0"] .perk-card:hover, #ui-layer[data-theme="0"] .perk-card.selected {

  #ui-layer[data-theme="0"] .perk-key { font-family: var(--font-head); font-weight: 400; font-size: 9px; letter-spacing: 0.04em; color: var(--ms-navy); background: var(--ms-coffee); }

    #ui-layer[data-theme="0"] .perk-desc { font-size: 16px; }

  @media (max-width: 640px) {
    #ui-layer .perk-card { display: grid !important; grid-template-columns: 52px minmax(0, 1fr); grid-template-areas: "icon ribbon" "icon name" "icon desc" "icon key";

  /* ===== Brand pass 2 (Nov 3): HUD + lower third match the devlog ===== */

  .vs-hud .ms-bar { background: #0d1124; border: 2px solid #171C35; box-shadow: 0 0 0 1px rgba(62,119,117,0.9), 0 3px 0 rgba(0,0,0,0.35); }

  .vs-hud .vs-lv { font-family: 'Silkscreen', monospace; font-size: clamp(10px, calc(var(--msbar-h) * 0.8), 13px); color: var(--ms-white);

  .vs-hud .vs-score { font-family: 'Silkscreen', monospace; font-weight: 400; color: var(--ms-white); text-shadow: 2px 2px 0 var(--ms-navy); }
  .vs-hud .vs-coins { font-family: 'Silkscreen', monospace; color: var(--ms-cream); text-shadow: 2px 2px 0 var(--ms-navy); }
  .vs-hud .vs-timer { font-family: 'Silkscreen', monospace; font-weight: 700; color: var(--ms-white); text-shadow: 3px 3px 0 var(--ms-navy); }
  .vs-hud .vs-timer-final { color: var(--ms-red); }
