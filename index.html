<meta charset="utf-8">
<title>Midlife Survivors Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Cinzel:wght@700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; margin: 0; background: #1b1f38; overflow: hidden; touch-action: none; color-scheme: dark; font-family: 'Chakra Petch', sans-serif; }
  #game { position: fixed; inset: 0; }
  #game > canvas:not(#three-overlay) { position: relative; z-index: 1; }

  /* =========================================================================
     CHAMELEON + CORPORATE SATIRE UI OVERLAY (#ui-layer)
     Theme 0: 16-Bit Retro Pixel ("CORP-OS v1.98")
     Theme 1: Stylistic Indie Diablo 3/4 ("SANCTUARY HR")
     Theme 2: AAA 3D Fortnite Action ("MIDLIFE ROYALE")
     ========================================================================= */
  #ui-layer {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    --bg-pod: rgba(18, 21, 42, 0.90);
    --border-col: #f0a24f;
    --accent: #ffe042;
    --text-main: #f2f4fa;
    --text-muted: #9aa6c8;
    --hp-grad: linear-gradient(90deg, #d9383a, #ff6b52);
    --xp-grad: linear-gradient(90deg, #2b82d9, #6be2ff);
    --font-head: 'Press Start 2P', monospace;
    --font-body: 'Chakra Petch', monospace;
    --pod-radius: 4px;
    --pod-skew: 0deg;
    --pod-shadow: 4px 4px 0px #090b14;
  }

  /* Theme 1: Diablo 3/4 Stylistic Indie */
  #ui-layer[data-theme="1"] {
    --bg-pod: rgba(12, 10, 19, 0.92);
    --border-col: #c99b49;
    --accent: #f5c96b;
    --hp-grad: linear-gradient(90deg, #6e0a14, #d92638);
    --xp-grad: linear-gradient(90deg, #4b2d99, #9d75ff);
    --font-head: 'Cinzel', serif;
    --pod-radius: 2px;
    --pod-shadow: 0 8px 24px rgba(0,0,0,0.85), inset 0 0 12px rgba(201,155,73,0.18);
  }

  /* Theme 2: Fortnite AAA 3D Action */
  #ui-layer[data-theme="2"] {
    --bg-pod: rgba(16, 28, 62, 0.78);
    --border-col: #00e5ff;
    --accent: #ffe600;
    --hp-grad: linear-gradient(90deg, #00e676, #69f0ae);
    --xp-grad: linear-gradient(90deg, #00b0ff, #e040fb);
    --font-head: 'Bungee', sans-serif;
    --pod-radius: 10px;
    --pod-skew: -4deg;
    --pod-shadow: 0 10px 28px rgba(0, 229, 255, 0.22);
  }

  .hidden { display: none !important; }

  /* TOP HUD ROW */
  .hud-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; padding: 12px 16px; width: 100%;
  }
  .hud-pod {
    background: var(--bg-pod);
    border: 2px solid var(--border-col);
    border-radius: var(--pod-radius);
    box-shadow: var(--pod-shadow);
    backdrop-filter: blur(8px);
    transform: skewX(var(--pod-skew));
    padding: 8px 12px;
    pointer-events: auto;
    transition: all 0.22s ease;
  }

  /* Top-Left Employee ID Pod */
  .hud-left { min-width: 245px; max-width: 290px; }
  .id-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .id-avatar {
    width: 34px; height: 34px; border-radius: 6px;
    background: rgba(255,255,255,0.08); border: 1.5px solid var(--border-col);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .id-titles { flex: 1; line-height: 1.15; }
  .id-dept { font-size: 9px; color: var(--accent); letter-spacing: 0.6px; font-weight: 700; }
  .id-name { font-size: 13px; color: var(--text-main); font-weight: 700; }
  .id-lv {
    font-family: var(--font-head); font-size: 11px; color: #12152a;
    background: var(--accent); padding: 4px 7px; border-radius: 4px; font-weight: 700;
  }

  .bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .bar-label { font-size: 10px; font-weight: 700; width: 22px; color: var(--text-muted); }
  .bar-track {
    flex: 1; height: 14px; background: rgba(6, 8, 18, 0.85);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .bar-fill { height: 100%; transition: width 0.16s ease-out; }
  .hp-fill { background: var(--hp-grad); }
  .xp-fill { background: var(--xp-grad); }
  .bar-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #ffffff; text-shadow: 0 1px 2px #000;
  }

  .loadout-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .perk-badge {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main);
  }

  /* Top-Center Decade Timeline */
  .hud-center { flex: 1; max-width: 440px; padding: 8px 14px 18px; }
  .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .timeline-title { font-size: 10px; color: var(--text-muted); letter-spacing: 0.8px; font-weight: 700; }
  .timeline-age { font-family: var(--font-head); font-size: 12px; color: var(--accent); }
  .timeline-track {
    height: 10px; background: rgba(6, 8, 18, 0.9); border: 1px solid var(--border-col);
    border-radius: 5px; position: relative;
  }
  .timeline-fill {
    height: 100%; background: linear-gradient(90deg, #f0a24f, #ffe042);
    border-radius: 4px; transition: width 0.2s linear;
  }
  .milestone {
    position: absolute; top: 11px; transform: translateX(-50%);
    font-size: 9px; color: var(--text-muted); font-weight: 700; white-space: nowrap;
  }
  .milestone.boss-pip { color: #ff8a82; }
  .milestone.win-pip { color: #ffe042; }

  /* Top-Right 401(k) & Camera Switcher */
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .coin-pill {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 700; color: var(--accent);
  }
  .style-pill {
    display: flex; align-items: center; gap: 3px;
    background: rgba(0,0,0,0.45); padding: 3px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .style-key { font-size: 10px; color: var(--accent); padding: 0 4px; font-weight: 700; }
  .style-opt {
    background: transparent; border: none; color: var(--text-muted);
    font-family: var(--font-body); font-size: 10px; font-weight: 700;
    padding: 4px 7px; border-radius: 3px; cursor: pointer;
  }
  .style-opt.active { background: var(--border-col); color: #0d1021; }
  .util-btns { display: flex; gap: 6px; }
  .util-btn {
    background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.28);
    color: var(--text-main); font-family: var(--font-body); font-size: 12px; font-weight: 700;
    padding: 6px 11px; min-height: 34px; border-radius: 5px; cursor: pointer;
    touch-action: manipulation;
  }
  .util-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* UNIVERSAL KEYBOARD & CONTROLLER FOCUS HIGHLIGHT (.nav-focused) */
  .nav-focused {
    outline: 3px solid var(--accent) !important;
    outline-offset: 2px !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 20px rgba(255, 224, 66, 0.65) !important;
    transform: translateY(-2px) scale(1.025) !important;
    z-index: 6;
  }
  .nav-hint-bar {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-size: 11px; color: var(--text-muted); font-weight: 700;
    display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  .nav-hint-bar b { color: var(--accent); }

  /* PAUSE & OPTIONS MENU LIST */
  .options-list {
    display: flex; flex-direction: column; gap: 8px; margin: 12px 0 6px;
  }
  .opt-btn {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(10, 13, 28, 0.92); border: 2px solid rgba(255,255,255,0.22);
    color: var(--text-main); border-radius: var(--pod-radius);
    font-family: var(--font-body); font-size: 14px; font-weight: 700;
    padding: 12px 16px; cursor: pointer; text-align: left; width: 100%;
    transition: all 0.12s ease; touch-action: manipulation;
  }
  .opt-btn span.opt-val {
    font-family: var(--font-head); font-size: 11px; color: var(--accent);
    background: rgba(255,255,255,0.1); padding: 4px 9px; border-radius: 4px;
  }
  .opt-btn.primary-opt {
    background: var(--border-col); color: #0d1021; border-color: var(--border-col);
    font-family: var(--font-head); font-size: 13px; justify-content: center;
  }

  /* MOBILE FLOATING QUICK-CONTROLS & VIRTUAL TOUCH JOYSTICK */
  .mobile-dock {
    position: fixed; bottom: 16px; right: 16px; z-index: 20;
    display: flex; gap: 8px; pointer-events: auto;
  }
  .mob-fab {
    background: var(--bg-pod); border: 2px solid var(--border-col);
    color: var(--text-main); border-radius: 999px;
    font-family: var(--font-body); font-size: 13px; font-weight: 700;
    padding: 10px 14px; min-height: 44px; min-width: 44px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    cursor: pointer; touch-action: manipulation;
  }
  .mob-fab:active { transform: scale(0.94); border-color: var(--accent); }

  .touch-joystick {
    position: fixed; width: 96px; height: 96px; margin-left: -48px; margin-top: -48px;
    border-radius: 50%; border: 2px solid rgba(255, 224, 66, 0.55);
    background: rgba(12, 16, 34, 0.38); pointer-events: none; z-index: 15;
  }
  .touch-knob {
    position: absolute; left: 50%; top: 50%; width: 38px; height: 38px;
    margin-left: -19px; margin-top: -19px; border-radius: 50%;
    background: rgba(255, 224, 66, 0.85); box-shadow: 0 0 12px rgba(255, 224, 66, 0.8);
  }

  /* BOSS OUTLOOK TOAST */
  .boss-toast {
    align-self: center; margin-top: 4px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(45, 8, 18, 0.94); border: 2px solid #ff3b4e;
    border-radius: var(--pod-radius); box-shadow: 0 8px 28px rgba(255, 46, 76, 0.45);
    padding: 10px 18px; animation: popIn 0.25s ease-out;
  }
  .toast-icon { font-size: 26px; }
  .toast-sub { font-size: 10px; color: #ff99a4; font-weight: 700; letter-spacing: 0.8px; }
  .toast-title { font-family: var(--font-head); font-size: 14px; color: #ffe042; margin-top: 2px; }

  /* MODALS (Level-Up, Title Dossier, Pause, Game Over) */
  .ui-modal {
    position: fixed; inset: 0; z-index: 30; pointer-events: auto;
    background: rgba(8, 10, 22, 0.78); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-card {
    background: var(--bg-pod); border: 3px solid var(--border-col);
    border-radius: var(--pod-radius); box-shadow: var(--pod-shadow);
    padding: 20px 24px; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto;
    text-align: center; -webkit-overflow-scrolling: touch;
    transform: skewX(var(--pod-skew)); animation: popIn 0.2s ease-out;
  }
  .modal-kicker { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 1.2px; margin-bottom: 4px; }
  .modal-title { font-family: var(--font-head); font-size: 20px; color: var(--text-main); margin: 4px 0 6px; }
  .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

  /* 3 VERTICAL PERK CARDS SIDE-BY-SIDE */
  .perk-cards-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .perk-card {
    background: rgba(10, 13, 28, 0.92); border: 2px solid rgba(255,255,255,0.22);
    border-radius: var(--pod-radius); padding: 14px 10px 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    cursor: pointer; transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    min-height: 205px;
  }
  .perk-card:hover, .perk-card.selected {
    transform: translateY(-6px) scale(1.03);
    border-color: var(--accent);
    box-shadow: 0 8px 22px rgba(255, 224, 66, 0.28);
    background: rgba(34, 42, 82, 0.95);
  }
  .perk-card.rarity-unlock { border-color: #5fb3f0; }
  .perk-card.rarity-evo {
    border-color: #ffe042;
    background: linear-gradient(180deg, rgba(68, 48, 12, 0.95), rgba(22, 18, 38, 0.95));
  }
  .perk-ribbon {
    font-size: 9px; font-weight: 700; letter-spacing: 0.7px;
    padding: 3px 8px; border-radius: 3px; background: rgba(255,255,255,0.1); color: var(--accent);
  }
  .perk-icon { font-size: 38px; margin: 10px 0 6px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
  .perk-name { font-family: var(--font-head); font-size: 12px; color: var(--text-main); line-height: 1.3; margin-bottom: 6px; }
  .perk-desc { font-size: 12px; color: #cbd4f0; line-height: 1.35; flex: 1; }
  .perk-key {
    margin-top: 10px; font-size: 10px; font-weight: 700; color: #12152a;
    background: var(--border-col); padding: 3px 10px; border-radius: 3px;
  }

  /* TITLE SCREEN DOSSIER & 401(k) SHOP */
  .title-box { max-width: 720px; padding: 18px 22px; }
  .title-top-banner {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.14);
    padding-bottom: 6px; margin-bottom: 8px;
  }
  .dossier-stamp { color: #ff8a82; font-weight: 700; letter-spacing: 0.8px; }
  .dossier-balance b { color: var(--accent); font-size: 13px; }
  .game-logo {
    font-family: var(--font-head); font-size: 26px; color: var(--border-col);
    margin: 4px 0; text-shadow: 0 3px 0 #090b14;
  }
  .game-tagline { font-size: 12px; color: #cbd4f0; margin: 0 0 10px; }
  .section-label {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.8px; margin: 8px 0 6px;
  }
  .dossier-chars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dossier-char {
    background: rgba(10, 13, 28, 0.88); border: 2px solid rgba(255,255,255,0.18);
    border-radius: var(--pod-radius); padding: 8px; cursor: pointer; transition: all 0.14s ease;
  }
  .dossier-char.selected { border-color: var(--accent); background: rgba(42, 52, 98, 0.92); }
  .dossier-char:hover { transform: translateY(-2px); border-color: var(--border-col); }
  .char-emoji { font-size: 22px; }
  .char-title { font-weight: 700; font-size: 12px; color: var(--text-main); margin: 2px 0; }
  .char-desc { font-size: 10px; color: var(--text-muted); min-height: 26px; }
  .char-badge {
    display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.1); color: var(--accent);
  }

  .shop-list { display: flex; flex-direction: column; gap: 5px; }
  .shop-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(10, 13, 28, 0.85); border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: var(--pod-radius); padding: 6px 10px; cursor: pointer;
  }
  .shop-row.affordable { border-color: var(--border-col); }
  .shop-row.maxed { border-color: #6fbf73; opacity: 0.85; }
  .shop-info { display: flex; align-items: center; gap: 8px; text-align: left; font-size: 11px; }
  .shop-name { font-weight: 700; color: var(--text-main); }
  .shop-pips { color: var(--accent); letter-spacing: 1px; font-size: 11px; }
  .shop-desc { color: var(--text-muted); }
  .shop-buy-btn {
    background: var(--border-col); color: #12152a; border: none; border-radius: 3px;
    font-family: var(--font-body); font-size: 11px; font-weight: 700; padding: 4px 10px; cursor: pointer;
  }

  .title-footer { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .title-style-switcher {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--text-muted);
  }
  .t-style-btn {
    background: rgba(10,13,28,0.9); border: 1.5px solid rgba(255,255,255,0.22);
    color: var(--text-main); font-family: var(--font-body); font-size: 11px; font-weight: 700;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  .t-style-btn.active { background: var(--accent); color: #12152a; border-color: var(--accent); }

  .cta-btn {
    background: var(--border-col); color: #0d1021; border: none; border-radius: var(--pod-radius);
    font-family: var(--font-head); font-size: 14px; font-weight: 700;
    padding: 12px 22px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform 0.12s ease, background 0.12s ease; width: 100%;
  }
  .cta-btn:hover { transform: scale(1.02); background: var(--accent); }
  .secondary-btn { background: #5fb3f0; }

  /* GAME OVER / VICTORY */
  .gameover-cause { font-size: 15px; color: #ffffff; font-style: italic; margin: 12px 0; line-height: 1.45; }
  .gameover-stats { display: flex; justify-content: center; gap: 12px; margin: 14px 0; }
  .stat-pill {
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 5px; padding: 6px 12px; display: flex; flex-direction: column; font-size: 10px; color: var(--text-muted);
  }
  .stat-pill b { font-size: 14px; color: var(--accent); margin-top: 2px; }
  .gameover-actions { display: flex; gap: 10px; margin-top: 10px; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) skewX(var(--pod-skew)); }
    to   { opacity: 1; transform: scale(1) skewX(var(--pod-skew)); }
  }
  @media (max-width: 768px) {
    .hud-top { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
    .hud-left { min-width: 175px; flex: 1; padding: 6px 8px; }
    .hud-center { order: 3; width: 100%; max-width: 100%; flex-basis: 100%; padding: 6px 10px 14px; }
    .hud-right { padding: 6px 8px; }
    .style-pill { display: none; }
    .perk-cards-grid, .dossier-chars-grid { grid-template-columns: 1fr; }
    .perk-card { min-height: auto; flex-direction: row; gap: 10px; text-align: left; padding: 10px; }
    .perk-icon { font-size: 28px; margin: 0; }
    .modal-card { padding: 14px; transform: none; }
    .game-logo { font-size: 18px; }
    .gameover-actions { flex-direction: column; }
  }
</style>
<div id="game"></div>
<div id="ui-layer" data-theme="0"></div>
